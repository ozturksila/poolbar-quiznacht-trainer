<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Poolbar Quiznacht Trainer</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <div class="brand">
    <h1>Poolbar Quiznacht Trainer</h1>
    <div class="sub">Vorarlberg pub quiz practice</div>
  </div>

  <section id="screen-start" class="screen active">
    <div class="card">
      <h2>Choose a question set</h2>
      <div id="set-list" class="set-list">
        <div class="empty-note">Loading question sets…</div>
      </div>
      <label class="name-field">
        <span>Your name (optional)</span>
        <input type="text" id="player-name" placeholder="You" maxlength="40" />
      </label>
      <div class="btn-row">
        <button id="btn-start" class="btn">Start Quiz</button>
        <button id="btn-view-history" class="btn secondary">History</button>
      </div>
    </div>
  </section>

  <section id="screen-quiz" class="screen">
    <div class="card">
      <div class="scoreboard">
        <span id="quiz-progress">Q 1/50</span>
        <span id="quiz-score">Score 0</span>
      </div>
      <div id="quiz-dots" class="dots"></div>
      <div id="quiz-category" class="category-tag"></div>
      <p id="quiz-question" class="question-text"></p>
      <div id="quiz-options" class="options"></div>
      <div class="btn-row">
        <button id="btn-next" class="btn" style="display:none">Next Question</button>
      </div>
    </div>
  </section>

  <section id="screen-results" class="screen">
    <div class="card">
      <h2>Round complete</h2>
      <div class="results-score">
        <div class="big" id="results-score">0 / 0</div>
        <div class="pct" id="results-pct">0%</div>
      </div>
      <div class="btn-row">
        <button id="btn-play-again" class="btn">Play Again</button>
        <button id="btn-download-results" class="btn secondary">Download Results</button>
        <button id="btn-results-history" class="btn secondary">History</button>
        <button id="btn-results-home" class="btn secondary">Home</button>
      </div>
    </div>
  </section>

  <section id="screen-history" class="screen">
    <div class="card">
      <h2>Score history</h2>
      <div id="history-list" class="history-list">
        <div class="empty-note">No rounds played yet.</div>
      </div>
      <div class="btn-row">
        <button id="btn-history-home" class="btn secondary">Home</button>
      </div>
    </div>
  </section>
</div>

<script src="js/storage.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
