<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Poolbar Quiznacht Trainer</title>
<style>
:root {
  --felt-dark: #06341f;
  --felt: #0c4a2e;
  --felt-light: #145c3a;
  --brass: #c9a227;
  --brass-bright: #e8c34a;
  --cream: #f3ecd9;
  --cream-dim: #cfc6ab;
  --red: #b3432b;
  --red-bright: #e0553a;
  --green-ok: #4c9a5b;
  --shadow: rgba(0, 0, 0, 0.35);
  --font-mono: "SFMono-Regular", "Consolas", "Liberation Mono", Menlo, monospace;
  --font-body: "Georgia", "Iowan Old Style", serif;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% -10%, var(--felt-light) 0%, var(--felt) 45%, var(--felt-dark) 100%);
  color: var(--cream);
  font-family: var(--font-body);
  display: flex;
  justify-content: center;
  padding: 24px 16px 48px;
}

#app {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

/* Header / branding */
.brand {
  text-align: center;
  margin-bottom: 28px;
}

.brand h1 {
  font-family: var(--font-mono);
  letter-spacing: 0.06em;
  color: var(--brass-bright);
  font-size: 1.5rem;
  margin: 0 0 4px;
  text-transform: uppercase;
  text-shadow: 0 2px 6px var(--shadow);
}

.brand .sub {
  color: var(--cream-dim);
  font-size: 0.85rem;
  font-family: var(--font-mono);
}

/* Card */
.card {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(0, 0, 0, 0.12));
  border: 1px solid rgba(201, 162, 39, 0.35);
  border-radius: 14px;
  padding: 24px 20px;
  box-shadow: 0 10px 30px var(--shadow);
}

/* Buttons */
button {
  font-family: var(--font-body);
  cursor: pointer;
}

.btn {
  display: inline-block;
  background: linear-gradient(180deg, var(--brass-bright), var(--brass));
  color: #23180a;
  border: none;
  border-radius: 8px;
  padding: 12px 22px;
  font-weight: bold;
  font-size: 1rem;
  letter-spacing: 0.02em;
  box-shadow: 0 3px 0 #8a6c15, 0 6px 14px var(--shadow);
  transition: transform 0.08s ease;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn:active {
  transform: translateY(1px);
  box-shadow: 0 1px 0 #8a6c15, 0 3px 8px var(--shadow);
}

.btn.secondary {
  background: transparent;
  color: var(--cream);
  border: 1px solid rgba(243, 236, 217, 0.4);
  box-shadow: none;
}

.btn.secondary:hover {
  border-color: var(--brass-bright);
  color: var(--brass-bright);
}

.btn-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 20px;
}

/* Start screen */
.set-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 18px 0;
}

.set-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid rgba(201, 162, 39, 0.25);
  border-radius: 8px;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--cream-dim);
}

.set-option input {
  accent-color: var(--brass);
}

.name-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 4px 0 18px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--cream-dim);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.name-field input {
  font-family: var(--font-body);
  font-size: 1rem;
  text-transform: none;
  letter-spacing: normal;
  background: rgba(0, 0, 0, 0.2);
  border: 1px solid rgba(201, 162, 39, 0.35);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--cream);
}

.name-field input:focus {
  outline: none;
  border-color: var(--brass-bright);
}

.embedded-set-label {
  font-family: var(--font-mono);
  font-size: 0.9rem;
  color: var(--cream-dim);
  padding: 10px 12px;
  border: 1px solid rgba(201, 162, 39, 0.25);
  border-radius: 8px;
}

/* Scoreboard */
.scoreboard {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  color: var(--brass-bright);
  font-size: 0.9rem;
  margin-bottom: 12px;
  letter-spacing: 0.03em;
}

.dots {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: rgba(243, 236, 217, 0.18);
  border: 1px solid rgba(201, 162, 39, 0.3);
}

.dot.done-correct {
  background: var(--green-ok);
  border-color: var(--green-ok);
}

.dot.done-wrong {
  background: var(--red);
  border-color: var(--red);
}

.dot.current {
  background: var(--brass-bright);
  border-color: var(--brass-bright);
}

/* Question */
.category-tag {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--brass);
  margin-bottom: 8px;
}

.question-text {
  font-size: 1.12rem;
  line-height: 1.5;
  margin: 0 0 20px;
  color: var(--cream);
}

.audio-block {
  margin: 0 0 20px;
  padding: 12px 14px;
  background: rgba(0, 0, 0, 0.18);
  border: 1px solid rgba(201, 162, 39, 0.3);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.audio-block audio {
  width: 100%;
}

.audio-credit {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--cream-dim);
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  text-align: left;
  background: rgba(0, 0, 0, 0.18);
  border: 1px solid rgba(243, 236, 217, 0.18);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--cream);
  font-size: 0.98rem;
  line-height: 1.4;
}

.option:hover:not(.disabled) {
  border-color: var(--brass-bright);
  background: rgba(201, 162, 39, 0.1);
}

.option .letter {
  font-family: var(--font-mono);
  color: var(--brass);
  font-weight: bold;
  flex-shrink: 0;
}

.option .opt-body {
  flex: 1;
}

.option .opt-info {
  display: none;
  margin-top: 6px;
  font-size: 0.85rem;
  color: var(--cream-dim);
  font-family: var(--font-mono);
  line-height: 1.4;
}

.option.revealed .opt-info {
  display: block;
}

.option.correct {
  border-color: var(--green-ok);
  background: rgba(76, 154, 91, 0.18);
}

.option.correct .letter {
  color: var(--green-ok);
}

.option.wrong {
  border-color: var(--red-bright);
  background: rgba(179, 67, 43, 0.18);
}

.option.wrong .letter {
  color: var(--red-bright);
}

.option.disabled {
  cursor: default;
}

/* Results */
.results-score {
  text-align: center;
  font-family: var(--font-mono);
  margin: 10px 0 24px;
}

.results-score .big {
  font-size: 2.6rem;
  color: var(--brass-bright);
}

.results-score .pct {
  color: var(--cream-dim);
  font-size: 0.9rem;
}

/* History */
.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-row {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  border-bottom: 1px dashed rgba(243, 236, 217, 0.15);
  padding: 8px 2px;
  color: var(--cream-dim);
}

.history-row .score {
  color: var(--brass-bright);
}

.empty-note {
  color: var(--cream-dim);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  text-align: center;
  padding: 20px 0;
}

h2 {
  font-family: var(--font-mono);
  color: var(--brass-bright);
  letter-spacing: 0.03em;
  font-size: 1.1rem;
  margin-top: 0;
}

@media (max-width: 420px) {
  .brand h1 {
    font-size: 1.2rem;
  }
  .card {
    padding: 18px 14px;
  }
}

</style>
</head>
<body>
<div id="app">
  <div class="brand">
    <h1>Poolbar Quiznacht Trainer</h1>
    <div class="sub">Vorarlberg pub quiz practice</div>
  </div>

  <section id="screen-start" class="screen active">
    <div class="card">
      <h2>Choose a question set</h2>
      <div id="set-list" class="set-list">
        <div class="empty-note">Loading question sets…</div>
      </div>
      <label class="name-field">
        <span>Your name (optional)</span>
        <input type="text" id="player-name" placeholder="You" maxlength="40" />
      </label>
      <div class="btn-row">
        <button id="btn-start" class="btn">Start Quiz</button>
        <button id="btn-view-history" class="btn secondary">History</button>
      </div>
    </div>
  </section>

  <section id="screen-quiz" class="screen">
    <div class="card">
      <div class="scoreboard">
        <span id="quiz-progress">Q 1/50</span>
        <span id="quiz-score">Score 0</span>
      </div>
      <div id="quiz-dots" class="dots"></div>
      <div id="quiz-category" class="category-tag"></div>
      <p id="quiz-question" class="question-text"></p>
      <div id="quiz-audio" class="audio-block" style="display:none"></div>
      <div id="quiz-options" class="options"></div>
      <div class="btn-row">
        <button id="btn-next" class="btn" style="display:none">Next Question</button>
      </div>
    </div>
  </section>

  <section id="screen-results" class="screen">
    <div class="card">
      <h2>Round complete</h2>
      <div class="results-score">
        <div class="big" id="results-score">0 / 0</div>
        <div class="pct" id="results-pct">0%</div>
      </div>
      <div class="btn-row">
        <button id="btn-play-again" class="btn">Play Again</button>
        <button id="btn-download-results" class="btn secondary">Download Results</button>
        <button id="btn-results-history" class="btn secondary">History</button>
        <button id="btn-results-home" class="btn secondary">Home</button>
      </div>
    </div>
  </section>

  <section id="screen-history" class="screen">
    <div class="card">
      <h2>Score history</h2>
      <div id="history-list" class="history-list">
        <div class="empty-note">No rounds played yet.</div>
      </div>
      <div class="btn-row">
        <button id="btn-history-home" class="btn secondary">Home</button>
      </div>
    </div>
  </section>
</div>

ean", "info": "A British director known for sweeping epics like 'Lawrence of Arabia,' rather than suspense thrillers."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-08", "category": "Movies & TV", "question": "Born in Taiwan, this director has moved fluidly between genres and languages, winning Best Director Oscars for both a wuxia martial arts epic and a survival tale about a boy adrift with a tiger. Who is he?", "options": [{"text": "Ang Lee", "info": "Won Oscars for 'Crouching Tiger, Hidden Dragon' and 'Life of Pi,' and also directed 'Brokeback Mountain.'"}, {"text": "John Woo", "info": "A Hong Kong director famous for stylized action films like 'Face/Off,' a different genre specialty."}, {"text": "Zhang Yimou", "info": "A mainland Chinese director known for visually lush films like 'Hero' and 'Raise the Red Lantern.'"}, {"text": "Wong Kar-wai", "info": "A Hong Kong director known for atmospheric, romantic dramas like 'In the Mood for Love.'"}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-09", "category": "Movies & TV", "question": "In 1975, a mechanical shark that kept malfunctioning during filming forced this young director to rely on suggestion and suspense rather than showing the creature directly — accidentally making 'Jaws' scarier and inventing the modern summer blockbuster. Who directed it?", "options": [{"text": "Steven Spielberg", "info": "Went on to direct 'E.T.,' 'Jurassic Park,' and 'Schindler's List' across a career spanning decades."}, {"text": "George Romero", "info": "An American director known for zombie horror films like 'Night of the Living Dead,' a different genre entirely."}, {"text": "John Carpenter", "info": "An American director known for horror and sci-fi films like 'Halloween' and 'The Thing.'"}, {"text": "Ridley Scott", "info": "A British director known for 'Alien' and 'Blade Runner,' slightly later in the decade."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-10", "ca d?", "options": [{"text": "Game of Thrones", "info": "Based on George R. R. Martin's 'A Song of Ice and Fire' novels, it ran for eight seasons starting in 2011."}, {"text": "The Wire", "info": "Another acclaimed HBO drama, set in Baltimore and focused on crime and institutions, not fantasy."}, {"text": "Rome", "info": "An earlier HBO historical drama set in the ancient world, not a fantasy series."}, {"text": "The Witcher", "info": "A rival fantasy series based on Polish novels, but produced by Netflix, not HBO."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-13", "category": "Art & Culture", "question": "Composed in just 24 days in 1741, this oratorio includes the famous 'Hallelujah' chorus, and tradition holds that audiences stand during it because England's King George II supposedly rose to his feet at the London premiere. Who composed it?", "options": [{"text": "George Frideric Handel", "info": "A German-born composer who spent most of his career in England, also known for his orchestral suite 'Water Music.'"}, {"text": "Johann Sebastian Bach", "info": "A contemporary German composer, famous for the 'Brandenburg Concertos' and church cantatas, but didn't write 'Messiah.'"}, {"text": "Henry Purcell", "info": "An earlier English Baroque composer, known for the opera 'Dido and Aeneas.'"}, {"text": "Antonio Vivaldi", "info": "An Italian Baroque composer best known for 'The Four Seasons,' working in a different musical tradition."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-14", "category": "Art & Culture", "question": "Written during a stay in the United States in the 1890s, this Czech composer's ninth symphony was inspired partly by African American spirituals and Native American melodies he encountered, and includes a famous largo movement later adapted into the song 'Goin' Home.' Who composed it?", "options": [{"text": "Antonín Dvořák", "info": "Directed a New York conservatory for several years and encouraged American composers to draw on their own folk traditions."}, {"text": "Bedřich Smetana", "info": "An earlier Czech composer known for the symphonic cycle 'Má vlast,' celebrating Bohemian landscapes and legends."}, {"text": "Leoš Janáček", "info": "A later Czech composer known for operas like 'Jenůfa,' working in a more modernist style."}, {"text": "Jean Sibelius", "info": "A Finnish composer known for 'Finlandia,' from a different national musical tradition entirely."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-15", "category": "Art & Culture", "question": "Commissioned for the opening of a new opera house in Cairo and set in ancient Egypt, this grand opera features a famous triumphal march often performed at outdoor spectacles with live elephants and horses. Who composed it?", "options": [{"text": "Giuseppe Verdi", "info": "One of the most performed opera composers in history, also known for 'La Traviata' and 'Rigoletto.'"}, {"text": "Giacomo Puccini", "info": "A later Italian opera composer known for 'La Bohème' and 'Madama Butterfly,' a generation after Verdi."}, {"text": "Gioachino Rossini", "info": "An earlier Italian opera composer known for comic works like 'The Barber of Seville.'"}, {"text": "Ruggero Leoncavallo", "info": "An Italian opera composer known for 'Pagliacci,' a contemporary of Puccini rather than Verdi."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-16", "category": "Art & Culture", "question": "Each movement of this early 20th-century orchestral suite is named after a planet and its corresponding astrological character, from the martial aggression of 'Mars' to the serene mysticism of 'Neptune' — and it was written before Pluto's discovery, so it isn't included. Who composed 'The Planets'?", "options": [{"text": "Gustav Holst", "info": "An English composer of German and Swedish descent, whose daughter Imogen later became a composer and conductor herself."}, {"text": "Ralph Vaughan Williams", "info": "A contemporary and close friend of Holst's, also an English composer, known for 'The Lark Ascending.'"}, {"text": "Benjamin Britten", "info": "A later English composer known for the opera 'Peter Grimes' and 'The Young Person's Guide to the Orchestra.'"}, {"text": "Edward Elgar", "info": "An earlier English composer best known for the 'Pomp and Circumstance' marches and the 'Enigma Variations.'"}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-17", "category": "Art & Culture", "question": "Besides painting what may be the most famous portrait in the world, this Renaissance polymath filled notebooks with mirror-written designs for flying machines, anatomical studies, and engineering concepts centuries ahead of his time. Who was he?", "options": [{"text": "Leonardo da Vinci", "info": "Painted both the 'Mona Lisa' and 'The Last Supper,' while also working as an engineer, inventor, and scientist."}, {"text": "Raphael", "info": "A younger contemporary Renaissance painter, known for works like 'The School of Athens,' but not for the notebooks or inventions."}, {"text": "Donatello", "info": "An earlier Renaissance sculptor, best known for his bronze statue of David."}, {"text": "Filippo Brunelleschi", "info": "A Renaissance architect and engineer famous for designing Florence Cathedral's dome, not the notebooks or paintings."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-18", "category": "Art & Culture", "question": "This contemporary Chinese artist and activist covered the floor of London's Tate Modern with a hundred million hand-painted porcelain sunflower seeds, and has used his art to criticize government censorship and human rights abuses, leading to his own detention in 2011. Who is he?", "options": [{"text": "Ai Weiwei", "info": "Helped design the 'Bird's Nest' stadium for the 2008 Beijing Olympics before later becoming an outspoken government critic."}, {"text": "Cai Guo-Qiang", "info": "Another contemporary Chinese artist, known for large-scale gunpowder and fireworks-based artworks."}, {"text": "Xu Bing", "info": "A Chinese contemporary artist known for invented, illegible calligraphy-like scripts."}, {"text": "Zhang Xiaogang", "info": "A Chinese painter known for haunting family-portrait style paintings from the 'Bloodline' series."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-19", "category": "Art & Culture", "question": "Known for room-sized mirrored installations filled with points of colored light and for covering surfaces in repetitive polka dots, this Japanese artist has voluntarily lived in a psychiatric institution since the 1970s, using art as a form of therapy. Who is she?", "options": [{"text": "Yayoi Kusama", "info": "Her 'Infinity Mirror Rooms' have become some of the most photographed art installations in the world."}, {"text": "Marina Abramović", "info": "A Serbian performance artist known for endurance-based works, not polka dots or mirror rooms."}, {"text": "Yoko Ono", "info": "A Japanese-American conceptual artist and musician, married to John Lennon, working in a different medium."}, {"text": "Cindy Sherman", "info": "An American photographer known for staged self-portraits in different characters and costumes."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-20", "category": "Science", "question": "Her X-ray diffraction image, known as 'Photo 51,' was crucial evidence for discovering the double-helix structure of DNA, but she died before the Nobel Prize was awarded for it in 1962 and initially received little public credit. Who was she?", "options": [{"text": "Rosalind Franklin", "info": "Her image was shown to James Watson without her knowledge, and her contribution wasn't widely recognized until decades after her death."}, {"text": "Barbara McClintock", "info": "An American geneticist who discovered 'jumping genes,' winning a Nobel Prize decades later, unrelated to DNA's structure."}, {"text": "Dorothy Hodgkin", "info": "A British chemist who won a Nobel Prize for determining the structures of important biomolecules using X-ray crystallography, but not DNA's structure."}, {"text": "Rita Levi-Montalcini", "info": "An Italian neurobiologist who discovered nerve growth factor, unrelated to this DNA research."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-21", "category": "Science", "question": "This Serbian-American inventor championed alternating current for electrical power distribution, competing fiercely against Thomas Edison's rival direct current system in what's remembered as the 'War of the Currents.' Who was he?", "options": [{"text": "Nikola Tesla", "info": "His AC system, commercialized with backing from George Westinghouse, ultimately became the standard for power grids worldwide."}, {"text": "Thomas Edison", "info": "Championed direct current and ran a publicity campaign highlighting AC's dangers, but he was Tesla's rival, not the AC pioneer."}, {"text": "George Westinghouse", "info": "The businessman who financed and commercialized Tesla's AC patents, though the underlying invention was Tesla's."}, {"text": "Guglielmo Marconi", "info": "An Italian inventor known for pioneering long-distance radio transmission, a different field entirely."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-22", "category": "Science", "question": "Her hand calculations of orbital mechanics were considered so reliable that astronaut John Glenn personally asked her to verify the electronic computer's numbers before his 1962 orbital flight. Who was this NASA mathematician?", "options": [{"text": "Katherine Johnson", "info": "Her story, along with fellow NASA mathematicians Dorothy Vaughan and Mary Jackson, was told in the film 'Hidden Figures.'"}, {"text": "Margaret Hamilton", "info": "Led the software engineering team for NASA's Apollo Guidance Computer, a slightly later and different NASA contribution."}, {"text": "Sally Ride", "info": "The first American woman in space, in 1983, decades after Johnson's calculations for Glenn's flight."}, {"text": "Valentina Tereshkova", "info": "A Soviet cosmonaut and the first woman in space, in 1963, a different role from Johnson's ground-based calculations."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-23", "category": "Science", "question": "Often nicknamed 'the powerhouse of the cell' in biology classrooms, these bean-shaped organelles generate most of a cell's chemical energy and even carry their own small ring of DNA, separate from the cell's nucleus. What are they called?", "options": [{"text": "Mitochondria", "info": "Believed to have originated as free-living bacteria absorbed by ancient cells in a mutually beneficial partnership, a theory called endosymbiosis."}, {"text": "Ribosomes", "info": "Cellular structures that build proteins by reading genetic instructions, but don't generate the cell's energy."}, {"text": "Chloroplasts", "info": "The energy-converting organelles found in plant cells specifically, using sunlight rather than the process mitochondria use."}, {"text": "Lysosomes", "info": "Cellular structures that break down waste and cellular debris, sometimes nicknamed the cell's 'garbage disposal.'"}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-24", "category": "Science", "question": "In 1869, this Russian chemist arranged the known chemical elements by atomic weight and recurring properties into a table, leaving deliberate gaps for elements he predicted existed but hadn't yet been discovered. Who was he?", "options": [{"text": "Dmitri Mendeleev", "info": "Several of his predicted 'missing' elements, including gallium and germanium, were discovered within his own lifetime, matching his forecasts closely."}, {"text": "Antoine Lavoisier", "info": "An 18th-century French chemist often called the father of modern chemistry, who compiled an early list of elements decades before Mendeleev's table."}, {"text": "Marie Curie", "info": "Discovered the elements polonium and radium later, but didn't create the periodic table itself."}, {"text": "John Dalton", "info": "An early 19th-century English chemist who developed modern atomic theory, before the periodic table existed."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-25", "category": "Science", "question": "Developed in 1935, this logarithmic scale for measuring earthquake magnitude means each whole-number increase represents roughly 32 times more released energy, not simply a linear step up. Whose name is it commonly associated with?", "options": [{"text": "Charles Richter", "info": "Developed the scale with colleague Beno Gutenberg at Caltech, though seismologists today mostly use updated moment magnitude scales instead."}, {"text": "Giuseppe Mercalli", "info": "An Italian volcanologist who developed an earlier scale measuring earthquake intensity based on observed damage, not a magnitude calculation."}, {"text": "Beno Gutenberg", "info": "Richter's close collaborator on the original scale, though it became publicly associated with Richter's name alone."}, {"text": "John Milne", "info": "A British seismologist sometimes called the 'father of modern seismology' for his work on early seismographs, decades before this scale."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-26", "category": "History & Geography", "question": "Built in the 15th century high in the Andes and abandoned within about a hundred years, this Inca citadel remained largely unknown to the outside world until an American historian was guided there by local farmers in 1911. What is it called?", "options": [{"text": "Machu Picchu", "info": "Located in present-day Peru, it's now one of South America's most visited archaeological sites and a UNESCO World Heritage Site."}, {"text": "Chichen Itza", "info": "A famous Maya pyramid complex, but located in Mexico, not Peru."}, {"text": "Tiwanaku", "info": "An earlier pre-Inca archaeological site near Lake Titicaca in Bolivia, a different civilization and location."}, {"text": "Sacsayhuamán", "info": "A separate Inca fortress complex near Cusco, known for its massive interlocking stone walls."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-27", "category": "History & Geography", "question": "Straddling the border of Nepal and Tibet, this is Earth's highest mountain above sea level, first confirmed summited in 1953 by a New Zealand beekeeper and a Nepali Sherpa mountaineer. What is it called?", "options": [{"text": "Mount Everest", "info": "Named after Sir George Everest, a former Surveyor General of India, though its Nepali name Sagarmatha and Tibetan name Chomolungma predate that."}, {"text": "K2", "info": "The world's second-highest mountain, located in the Karakoram range on the Pakistan-China border."}, {"text": "Kangchenjunga", "info": "The world's third-highest mountain, on the border of Nepal and India."}, {"text": "Annapurna", "info": "A notoriously dangerous Himalayan peak in Nepal, with one of the highest fatality rates among 8,000-meter mountains."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-28", "category": "History & Geography", "question": "This Pacific island kingdom is the only country in Oceania never formally colonized by a foreign power, having instead negotiated a protectorate status with Britain that preserved its own monarchy. Which country is it?", "options": [{"text": "Tonga", "info": "Its monarchy traces back over a thousand years, making it one of the oldest continuous monarchies still in existence today."}, {"text": "Samoa", "info": "Was administered first by Germany and later by New Zealand before gaining independence in 1962."}, {"text": "Fiji", "info": "Was a British colony from 1874 until independence in 1970."}, {"text": "Vanuatu", "info": "Was unusually jointly administered by both Britain and France as a condominium until 1980."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-29", "category": "History & Geography", "question": "Built and rebuilt over centuries by successive Chinese dynasties to defend against nomadic invasions from the north, this fortification stretches for thousands of kilometers, though the popular claim that it's visible from space with the naked eye is a myth. What is it called?", "options": [{"text": "The Great Wall of China", "info": "Most of the sections tourists visit today, near Beijing, date from the later Ming dynasty."}, {"text": "The Grand Canal", "info": "Another massive Chinese infrastructure project, but a waterway connecting northern and southern China, not a wall."}, {"text": "Hadrian's Wall", "info": "A much smaller Roman fortification across northern Britain, built to mark the empire's frontier."}, {"text": "The Great Zimbabwe walls", "info": "Stone enclosure walls built by the Kingdom of Great Zimbabwe in southern Africa, an entirely separate structure."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-30", "category": "History & Geography", "question": "Known for an advanced writing system, precise astronomical calendars, and step pyramids like those at Tikal and Chichen Itza, this civilization flourished across present-day Mexico, Guatemala, Belize, and Honduras for over a thousand years before Spanish contact. What is it called?", "options": [{"text": "The Maya", "info": "Rather than collapsing entirely, many Maya cities were already in decline before European contact, and Maya peoples and languages still exist today."}, {"text": "The Aztec", "info": "A later Mesoamerican civilization centered on the city of Tenochtitlan, in what's now central Mexico."}, {"text": "The Olmec", "info": "An earlier Mesoamerican civilization, sometimes called Mesoamerica's 'mother culture,' predating the Maya's peak by centuries."}, {"text": "The Inca", "info": "A civilization centered in the Andes of South America, geographically and culturally distinct from Mesoamerica."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-31", "category": "History & Geography", "question": "Aside from a brief occupation during World War II, this East African nation stands out for decisively defeating an invading European colonial army at the Battle of Adwa in 1896, preserving its independence at a time when most of the continent was being carved up by European powers. Which country is it?", "options": [{"text": "Ethiopia", "info": "Its victory over Italy at Adwa is still commemorated annually and made it a symbol of anti-colonial resistance across Africa."}, {"text": "Liberia", "info": "Also avoided formal European colonization, but through a very different history, founded by freed African-American settlers with US backing."}, {"text": "Sudan", "info": "Was ruled for decades as an Anglo-Egyptian condominium before gaining independence in 1956."}, {"text": "Somalia", "info": "Was split between Italian and British colonial administrations before independence and later unification."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-32", "category": "History & Geography", "question": "During the last Ice Age, falling sea levels exposed a land bridge across a narrow body of water separating two continents, allowing the first humans to walk from Asia into the Americas. What is this strait called today?", "options": [{"text": "The Bering Strait", "info": "Named after Danish-Russian explorer Vitus Bering, who charted it for Russia in the 18th century."}, {"text": "The Strait of Gibraltar", "info": "Separates Europe from Africa at the western end of the Mediterranean, a different strait entirely."}, {"text": "The Drake Passage", "info": "The turbulent body of water between South America and Antarctica, notorious among sailors."}, {"text": "The Strait of Malacca", "info": "A major shipping route between the Malay Peninsula and the island of Sumatra, in Southeast Asia."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-33", "category": "History & Geography", "question": "Carved directly into rose-colored sandstone cliffs by the Nabataean people over two thousand years ago, this ancient city in the desert of modern-day Jordan grew wealthy by controlling incense and spice trade routes, and later featured in a famous 'Indiana Jones' film. What is it called?", "options": [{"text": "Petra", "info": "Its most famous structure, the Treasury, was carved as a tomb but is often mistaken for having been a bank or storehouse."}, {"text": "Palmyra", "info": "Another ancient desert trading city, but located in Syria rather than Jordan."}, {"text": "Baalbek", "info": "An ancient Roman temple complex in Lebanon, known for some of the largest stone blocks ever quarried."}, {"text": "Ctesiphon", "info": "An ancient Persian imperial capital in what's now Iraq, known for its massive brick archway."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-34", "category": "History & Geography", "question": "Stretching roughly 6,400 kilometers and connecting Chinese silk producers to Mediterranean markets, this ancient network of trade routes also carried spices, ideas, religions, and, less deliberately, diseases like the bubonic plague between Asia and Europe. What is it commonly called?", "options": [{"text": "The Silk Road", "info": "The name itself was coined only in the 19th century by a German geographer, long after the trade routes' peak activity."}, {"text": "The Amber Road", "info": "A separate, much shorter trade route carrying amber from the Baltic Sea south to the Mediterranean."}, {"text": "The Incense Route", "info": "A trade network carrying frankincense and myrrh from Arabia toward the Mediterranean, a distinct but related network."}, {"text": "The Grand Trunk Road", "info": "One of South Asia's oldest and longest roads, connecting the Indian subcontinent, but a different route."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-35", "category": "History & Geography", "question": "From the 13th to 17th centuries, a confederation of merchant guilds and market towns along the Baltic and North Sea coasts banded together to protect shared trading interests, dominating commerce across Northern Europe for centuries without ever being a formal state. What was this confederation called?", "options": [{"text": "The Hanseatic League", "info": "Its most powerful member city, Lübeck, is still sometimes nicknamed the 'Queen of the Hanseatic League.'"}, {"text": "The Kalmar Union", "info": "A political union joining the crowns of Denmark, Norway, and Sweden, a different kind of Nordic alliance."}, {"text": "The Holy Roman Empire", "info": "A sprawling, loosely organized political entity covering much of Central Europe, but not a merchant trade confederation."}, {"text": "The Teutonic Order", "info": "A German crusading military order that controlled territory along the Baltic coast, related but distinct from the merchant league."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-36", "category": "History & Geography", "question": "Fought intermittently between 1337 and 1453 over succession to the French throne, this conflict between two royal houses actually lasted 116 years and featured figures like Joan of Arc before the French side ultimately prevailed. What is it called?", "options": [{"text": "The Hundred Years' War", "info": "Despite the name, it wasn't one continuous war but a series of related conflicts across more than a century."}, {"text": "The War of the Roses", "info": "A later English civil war between two rival branches of the House of Plantagenet, fought after this conflict ended."}, {"text": "The War of the Spanish Succession", "info": "A later, separate European conflict fought in the early 18th century over the Spanish throne."}, {"text": "The Thirty Years' War", "info": "A separate, later and even more devastating conflict, fought largely across Central Europe in the 17th century."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-37", "category": "History & Geography", "question": "During the brutal winter of 1939-40, this small Nordic country fought off a much larger Soviet invasion for over three months, inflicting disproportionate casualties partly through ski-mobile troops fighting in extreme cold, before eventually ceding some territory in peace talks. Which country was it?", "options": [{"text": "Finland", "info": "The conflict is remembered as the Winter War, and Finnish resistance became a symbol of small-nation resilience."}, {"text": "Norway", "info": "Was invaded by Nazi Germany the following year, in 1940, a separate conflict from the Winter War."}, {"text": "Estonia", "info": "A Baltic state annexed by the Soviet Union in 1940 without the sustained armed resistance Finland mounted."}, {"text": "Poland", "info": "Was invaded by both Germany and the Soviet Union in 1939, but in a different campaign from the Winter War."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-38", "category": "History & Geography", "question": "When Soviet forces blockaded all road and rail access to a divided city in 1948, Western allies responded by flying in food, fuel, and supplies around the clock for nearly a year, keeping the city's residents fed without breaking the blockade militarily. What is this operation called?", "options": [{"text": "The Berlin Airlift", "info": "At its peak, cargo planes were landing in West Berlin roughly every 90 seconds."}, {"text": "The Marshall Plan", "info": "A broader American program of economic aid to rebuild Western Europe after World War II, not this specific airlift."}, {"text": "Operation Overlord", "info": "The Allied invasion of Normandy in 1944, an earlier and unrelated World War II operation."}, {"text": "The Prague Spring", "info": "A later 1968 period of political liberalization in Czechoslovakia, crushed by a Soviet-led invasion — unrelated to Berlin."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-39", "category": "General Knowledge", "question": "Created in 1999 by a Japanese designer working for a mobile phone company, these small digital pictographs were originally just 176 simple 12-by-12 pixel images meant to make phone messages more expressive. What are they called?", "options": [{"text": "Emoji", "info": "The word comes from Japanese 'e' (picture) and 'moji' (character) — its resemblance to the English word 'emotion' is just a coincidence."}, {"text": "Emoticons", "info": "The earlier, older concept of building faces from punctuation marks like ':-)', a text-based predecessor to emoji."}, {"text": "Kaomoji", "info": "Japanese-style emoticons built from a wider range of characters, like '(^_^)', distinct from true pictographic emoji."}, {"text": "Stickers", "info": "Larger, more detailed illustrated images used in messaging apps, a separate and later feature from emoji."}], "correctIndex": 0, "dateAdded": "2026-08-01"}, {"id": "2026-08-01-40", "category": "General Knowledge", "question": "After a French newspaper mistakenly published his obituary while he was still alive, condemning him as a 'merchant of death' for inventing dynamite, this Swedish industrialist rewrote his will to fund a set of prizes meant to reward benefits to humanity instead. Who was he?", "options": [{"text": "Alfred Nobel", "info": "His prizes, first awarded in 1901, now span physics, chemistry, medicine, literature, peace, and later economics."}, {"text": "Andrew Carnegie", "info": "A Scottish-American steel magnate known for large-scale philanthropy, particularly funding public libraries, not the Nobel Prizes."}, {"text": "John D. Rockefeller", "info": "An American oil magnate whose foundation funded major philanthropic work, unrelated to the Nobel Prizes."}, {"text": "Cecil Rhodes", "info": "A British businessman whose fortune founded the Rhodes Scholarship, a different prestigious award."}], "correctIn const HISTORY_KEY = "poolbar-quiz-history";

function getHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (err) {
    console.error("Failed to read quiz history", err);
    return [];
  }
}

function addRoundToHistory(round) {
  const history = getHistory();
  history.unshift(round);
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch (err) {
    console.error("Failed to save quiz history", err);
  }
  return history;
}

window.QuizStorage = { getHistory, addRoundToHistory };

function shuffle(array) {
  const arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

async function loadManifest() {
  const res = await fetch("questions/manifest.json");
  if (!res.ok) throw new Error("Could not load questions/manifest.json");
  return res.json();
}

async function loadQuestionSet(fileName) {
  const res = await fetch(`questions/${fileName}`);
  if (!res.ok) throw new Error(`Could not load questions/${fileName}`);
  return res.json();
}

class QuizRound {
  constructor(questions) {
    this.questions = shuffle(questions).map((q) => this.prepareQuestion(q));
    this.currentIndex = 0;
    this.score = 0;
    this.answers = []; // { questionId, correct }
  }

  prepareQuestion(q) {
    const order = shuffle(q.options.map((_, i) => i));
    const options = order.map((originalIndex) => q.options[originalIndex]);
    const correctIndex = order.indexOf(q.correctIndex);
    return {
      id: q.id,
      category: q.category,
      question: q.question,
      options,
      correctIndex,
    };
  }

  get total() {
    return this.questions.length;
  }

  get current() {
    return this.questions[this.currentIndex];
  }

  get isLast() {
    return this.currentIndex === this.total - 1;
  }

  submitAnswer(selectedIndex) {
    const correct = selectedIndex === this.current.correctIndex;
    if (correct) this.score++;
    this.answers.push({
      questionId: this.current.id,
      category: this.current.category,
      correct,
    });
    return correct;
  }

  advance() {
    this.currentIndex++;
  }

  byCategory() {
    const stats = {};
    this.answers.forEach((a) => {
      if (!stats[a.category]) stats[a.category] = { correct: 0, total: 0 };
      stats[a.category].total++;
      if (a.correct) stats[a.category].correct++;
    });
    return stats;
  }
}

window.Quiz = { shuffle, loadManifest, loadQuestionSet, QuizRound };

const LETTERS = ["A", "B", "C", "D"];
const isEmbedded = Array.isArray(window.EMBEDDED_QUESTIONS);

const screens = {
  start: document.getElementById("screen-start"),
  quiz: document.getElementById("screen-quiz"),
  results: document.getElementById("screen-results"),
  history: document.getElementById("screen-history"),
};

let manifest = null;
let round = null;
let answered = false;
let playerName = "You";
let currentSetId = null;
let lastResult = null;

function showScreen(name) {
  Object.values(screens).forEach((el) => el.classList.remove("active"));
  screens[name].classList.add("active");
}

function slugify(text) {
  return (text || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "") || "player";
}

async function init() {
  if (isEmbedded) {
    renderEmbeddedSetLabel();
  } else {
    try {
      manifest = await Quiz.loadManifest();
      renderSetList();
    } catch (err) {
      document.getElementById("set-list").innerHTML =
        `<div class="empty-note">Failed to load question sets: ${err.message}</div>`;
    }
  }

  document.getElementById("btn-start").addEventListener("click", startQuiz);
  document.getElementById("btn-view-history").addEventListener("click", () => {
    renderHistory();
    showScreen("history");
  });
  document.getElementById("btn-next").addEventListener("click", nextQuestion);
  document.getElementById("btn-play-again").addEventListener("click", startQuiz);
  document.getElementById("btn-download-results").addEventListener("click", downloadResults);
  document.getElementById("btn-results-history").addEventListener("click", () => {
    renderHistory();
    showScreen("history");
  });
  document.getElementById("btn-results-home").addEventListener("click", () => showScreen("start"));
  document.getElementById("btn-history-home").addEventListener("click", () => showScreen("start"));
}

function renderEmbeddedSetLabel() {
  const meta = window.EMBEDDED_SET_META || {};
  const container = document.getElementById("set-list");
  container.innerHTML = `
    <div class="embedded-set-label">${meta.label || "Quiz set"} — ${window.EMBEDDED_QUESTIONS.length} questions</div>
  `;
}

function renderSetList() {
  const container = document.getElementById("set-list");
  container.innerHTML = "";
  manifest.sets.forEach((set, i) => {
    const label = document.createElement("label");
    label.className = "set-option";
    label.innerHTML = `
      <input type="checkbox" value="${set.file}" ${i === 0 ? "checked" : ""} />
      <span>${set.label} — ${set.questionCount} questions</span>
    `;
    container.appendChild(label);
  });
}

function getSelectedSetFiles() {
  return Array.from(document.querySelectorAll("#set-list input:checked")).map((el) => el.value);
}

async function startQuiz() {
  const nameInput = document.getElementById("player-name");
  playerName = (nameInput.value || "").trim() || "You";

  if (isEmbedded) {
    const meta = window.EMBEDDED_SET_META || {};
    currentSetId = meta.id || "embedded";
    round = new Quiz.QuizRound(window.EMBEDDED_QUESTIONS);
    answered = false;
    showScreen("quiz");
    renderQuestion();
    return;
  }

  const files = getSelectedSetFiles();
  if (files.length === 0) {
    alert("Pick at least one question set.");
    return;
  }
  const btn = document.getElementById("btn-start");
  btn.disabled = true;
  try {
    const sets = await Promise.all(files.map((f) => Quiz.loadQuestionSet(f)));
    const allQuestions = sets.flat();
    currentSetId = files.map((f) => f.replace(/\.json$/, "")).join("+");
    round = new Quiz.QuizRound(allQuestions);
    answered = false;
    showScreen("quiz");
    renderQuestion();
  } catch (err) {
    alert(`Failed to start quiz: ${err.message}`);
  } finally {
    btn.disabled = false;
  }
}

function renderDots() {
  const dots = document.getElementById("quiz-dots");
  dots.innerHTML = "";
  round.questions.forEach((q, i) => {
    const dot = document.createElement("span");
    dot.className = "dot";
    if (i < round.answers.length) {
      dot.classList.add(round.answers[i].correct ? "done-correct" : "done-wrong");
    } else if (i === round.currentIndex) {
      dot.classList.add("current");
    }
    dots.appendChild(dot);
  });
}

function renderAudio(audio) {
  const container = document.getElementById("quiz-audio");
  if (!audio || !audio.url) {
    container.innerHTML = "";
    container.style.display = "none";
    return;
  }
  container.style.display = "block";
  container.innerHTML = `
    <audio controls preload="none" src="${audio.url}"></audio>
    ${audio.credit ? `<span class="audio-credit">${audio.credit}</span>` : ""}
  `;
}

function renderQuestion() {
  answered = false;
  const q = round.current;

  document.getElementById("quiz-progress").textContent = `Q ${round.currentIndex + 1}/${round.total}`;
  document.getElementById("quiz-score").textContent = `Score ${round.score}`;
  document.getElementById("quiz-category").textContent = q.category;
  document.getElementById("quiz-question").textContent = q.question;
  renderAudio(q.audio);
  renderDots();

  const optionsEl = document.getElementById("quiz-options");
  optionsEl.innerHTML = "";
  q.options.forEach((opt, i) => {
    const div = document.createElement("div");
    div.className = "option";
    div.dataset.index = i;
    div.innerHTML = `
      <span class="letter">${LETTERS[i]}</span>
      <span class="opt-body">
        <span class="opt-text">${opt.text}</span>
        <span class="opt-info">${opt.info}</span>
      </span>
    `;
    div.addEventListener("click", () => selectAnswer(i));
    optionsEl.appendChild(div);
  });

  document.getElementById("btn-next").style.display = "none";
}

function selectAnswer(selectedIndex) {
  if (answered) return;
  answered = true;

  const q = round.current;
  const correct = round.submitAnswer(selectedIndex);

  const optionEls = document.querySelectorAll("#quiz-options .option");
  optionEls.forEach((el) => {
    const i = Number(el.dataset.index);
    el.classList.add("disabled", "revealed");
    if (i === q.correctIndex) {
      el.classList.add("correct");
    } else if (i === selectedIndex) {
      el.classList.add("wrong");
    }
  });

  document.getElementById("quiz-score").textContent = `Score ${round.score}`;
  renderDots();

  const nextBtn = document.getElementById("btn-next");
  nextBtn.textContent = round.isLast ? "See Results" : "Next Question";
  nextBtn.style.display = "inline-block";
}

function nextQuestion() {
  if (round.isLast) {
    finishRound();
    return;
  }
  round.advance();
  renderQuestion();
}

function finishRound() {
  const entry = {
    date: new Date().toISOString(),
    name: playerName,
    setId: currentSetId,
    score: round.score,
    total: round.total,
    byCategory: round.byCategory(),
    answers: round.answers,
  };
  lastResult = entry;
  QuizStorage.addRoundToHistory(entry);

  document.getElementById("results-score").textContent = `${round.score} / ${round.total}`;
  const pct = round.total ? Math.round((round.score / round.total) * 100) : 0;
  document.getElementById("results-pct").textContent = `${pct}%`;
  showScreen("results");
}

function downloadResults() {
  if (!lastResult) return;
  const dateSlug = lastResult.date.slice(0, 10);
  const fileName = `results-${slugify(lastResult.name)}-${dateSlug}.json`;
  const blob = new Blob([JSON.stringify(lastResult, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderHistory() {
  const list = document.getElementById("history-list");
  const history = QuizStorage.getHistory();
  if (history.length === 0) {
    list.innerHTML = `<div class="empty-note">No rounds played yet.</div>`;
    return;
  }
  list.innerHTML = "";
  history.forEach((entry) => {
    const row = document.createElement("div");
    row.className = "history-row";
    const date = new Date(entry.date);
    const dateStr = isNaN(date) ? entry.date : date.toLocaleString();
    const namePart = entry.name ? `${entry.name} — ` : "";
    row.innerHTML = `
      <span>${namePart}${dateStr}</span>
      <span class="score">${entry.score} / ${entry.total}</span>
    `;
    list.appendChild(row);
  });
}

init();

</script>

</body>
</html>
