<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Poolbar Quiznacht Trainer</title>
<style>
:root {
  --felt-dark: #06341f;
  --felt: #0c4a2e;
  --felt-light: #145c3a;
  --brass: #c9a227;
  --brass-bright: #e8c34a;
  --cream: #f3ecd9;
  --cream-dim: #cfc6ab;
  --red: #b3432b;
  --red-bright: #e0553a;
  --green-ok: #4c9a5b;
  --shadow: rgba(0, 0, 0, 0.35);
  --font-mono: "SFMono-Regular", "Consolas", "Liberation Mono", Menlo, monospace;
  --font-body: "Georgia", "Iowan Old Style", serif;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% -10%, var(--felt-light) 0%, var(--felt) 45%, var(--felt-dark) 100%);
  color: var(--cream);
  font-family: var(--font-body);
  display: flex;
  justify-content: center;
  padding: 24px 16px 48px;
}

#app {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

/* Header / branding */
.brand {
  text-align: center;
  margin-bottom: 28px;
}

.brand h1 {
  font-family: var(--font-mono);
  letter-spacing: 0.06em;
  color: var(--brass-bright);
  font-size: 1.5rem;
  margin: 0 0 4px;
  text-transform: uppercase;
  text-shadow: 0 2px 6px var(--shadow);
}

.brand .sub {
  color: var(--cream-dim);
  font-size: 0.85rem;
  font-family: var(--font-mono);
}

/* Card */
.card {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(0, 0, 0, 0.12));
  border: 1px solid rgba(201, 162, 39, 0.35);
  border-radius: 14px;
  padding: 24px 20px;
  box-shadow: 0 10px 30px var(--shadow);
}

/* Buttons */
button {
  font-family: var(--font-body);
  cursor: pointer;
}

.btn {
  display: inline-block;
  background: linear-gradient(180deg, var(--brass-bright), var(--brass));
  color: #23180a;
  border: none;
  border-radius: 8px;
  padding: 12px 22px;
  font-weight: bold;
  font-size: 1rem;
  letter-spacing: 0.02em;
  box-shadow: 0 3px 0 #8a6c15, 0 6px 14px var(--shadow);
  transition: transform 0.08s ease;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn:active {
  transform: translateY(1px);
  box-shadow: 0 1px 0 #8a6c15, 0 3px 8px var(--shadow);
}

.btn.secondary {
  background: transparent;
  color: var(--cream);
  border: 1px solid rgba(243, 236, 217, 0.4);
  box-shadow: none;
}

.btn.secondary:hover {
  border-color: var(--brass-bright);
  color: var(--brass-bright);
}

.btn-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 20px;
}

/* Start screen */
.set-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 18px 0;
}

.set-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid rgba(201, 162, 39, 0.25);
  border-radius: 8px;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--cream-dim);
}

.set-option input {
  accent-color: var(--brass);
}

.name-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 4px 0 18px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--cream-dim);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.name-field input {
  font-family: var(--font-body);
  font-size: 1rem;
  text-transform: none;
  letter-spacing: normal;
  background: rgba(0, 0, 0, 0.2);
  border: 1px solid rgba(201, 162, 39, 0.35);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--cream);
}

.name-field input:focus {
  outline: none;
  border-color: var(--brass-bright);
}

.embedded-set-label {
  font-family: var(--font-mono);
  font-size: 0.9rem;
  color: var(--cream-dim);
  padding: 10px 12px;
  border: 1px solid rgba(201, 162, 39, 0.25);
  border-radius: 8px;
}

/* Scoreboard */
.scoreboard {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  color: var(--brass-bright);
  font-size: 0.9rem;
  margin-bottom: 12px;
  letter-spacing: 0.03em;
}

.dots {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: rgba(243, 236, 217, 0.18);
  border: 1px solid rgba(201, 162, 39, 0.3);
}

.dot.done-correct {
  background: var(--green-ok);
  border-color: var(--green-ok);
}

.dot.done-wrong {
  background: var(--red);
  border-color: var(--red);
}

.dot.current {
  background: var(--brass-bright);
  border-color: var(--brass-bright);
}

/* Question */
.category-tag {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--brass);
  margin-bottom: 8px;
}

.question-text {
  font-size: 1.12rem;
  line-height: 1.5;
  margin: 0 0 20px;
  color: var(--cream);
}

.audio-block {
  margin: 0 0 20px;
  padding: 12px 14px;
  background: rgba(0, 0, 0, 0.18);
  border: 1px solid rgba(201, 162, 39, 0.3);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.audio-block audio {
  width: 100%;
}

.yt-wrap {
  position: relative;
  width: 100%;
  padding-top: 56.25%; /* 16:9 */
  border-radius: 6px;
  overflow: hidden;
}

.yt-wrap iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

.yt-wrap.hidden iframe {
  filter: blur(28px) brightness(0.55);
  pointer-events: none;
}

.yt-reveal-btn {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: none;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 24px;
  background: rgba(6, 52, 31, 0.35);
  border: none;
  color: var(--cream);
  font-family: var(--font-mono);
  font-size: 0.9rem;
  cursor: pointer;
}

.yt-wrap.hidden .yt-reveal-btn {
  display: flex;
}

.audio-credit {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--cream-dim);
}

.audio-credit.hidden {
  display: none;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  text-align: left;
  background: rgba(0, 0, 0, 0.18);
  border: 1px solid rgba(243, 236, 217, 0.18);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--cream);
  font-size: 0.98rem;
  line-height: 1.4;
}

.option:hover:not(.disabled) {
  border-color: var(--brass-bright);
  background: rgba(201, 162, 39, 0.1);
}

.option .letter {
  font-family: var(--font-mono);
  color: var(--brass);
  font-weight: bold;
  flex-shrink: 0;
}

.option .opt-body {
  flex: 1;
}

.option .opt-info {
  display: none;
  margin-top: 6px;
  font-size: 0.85rem;
  color: var(--cream-dim);
  font-family: var(--font-mono);
  line-height: 1.4;
}

.option.revealed .opt-info {
  display: block;
}

.option.correct {
  border-color: var(--green-ok);
  background: rgba(76, 154, 91, 0.18);
}

.option.correct .letter {
  color: var(--green-ok);
}

.option.wrong {
  border-color: var(--red-bright);
  background: rgba(179, 67, 43, 0.18);
}

.option.wrong .letter {
  color: var(--red-bright);
}

.option.disabled {
  cursor: default;
}

/* Results */
.results-score {
  text-align: center;
  font-family: var(--font-mono);
  margin: 10px 0 24px;
}

.results-score .big {
  font-size: 2.6rem;
  color: var(--brass-bright);
}

.results-score .pct {
  color: var(--cream-dim);
  font-size: 0.9rem;
}

/* History */
.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-row {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  border-bottom: 1px dashed rgba(243, 236, 217, 0.15);
  padding: 8px 2px;
  color: var(--cream-dim);
}

.history-row .score {
  color: var(--brass-bright);
}

.empty-note {
  color: var(--cream-dim);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  text-align: center;
  padding: 20px 0;
}

h2 {
  font-family: var(--font-mono);
  color: var(--brass-bright);
  letter-spacing: 0.03em;
  font-size: 1.1rem;
  margin-top: 0;
}

@media (max-width: 420px) {
  .brand h1 {
    font-size: 1.2rem;
  }
  .card {
    padding: 18px 14px;
  }
}

</style>
</head>
<body>
<div id="app">
  <div class="brand">
    <h1>Poolbar Quiznacht Trainer</h1>
    <div class="sub">Vorarlberg pub quiz practice</div>
  </div>

  <section id="screen-start" class="screen active">
    <div class="card">
      <h2>Choose a question set</h2>
      <div id="set-list" class="set-list">
        <div class="empty-note">Loading question sets…</div>
      </div>
      <label class="name-field">
        <span>Your name (optional)</span>
        <input type="text" id="player-name" placeholder="You" maxlength="40" />
      </label>
      <div class="btn-row">
        <button id="btn-start" class="btn">Start Quiz</button>
        <button id="btn-view-history" class="btn secondary">History</button>
      </div>
    </div>
  </section>

  <section id="screen-quiz" class="screen">
    <div class="card">
      <div class="scoreboard">
        <span id="quiz-progress">Q 1/50</span>
        <span id="quiz-score">Score 0</span>
      </div>
      <div id="quiz-dots" class="dots"></div>
      <div id="quiz-category" class="category-tag"></div>
      <p id="quiz-question" class="question-text"></p>
      <div id="quiz-audio" class="audio-block" style="display:none"></div>
      <div id="quiz-options" class="options"></div>
      <div class="btn-row">
        <button id="btn-next" class="btn" style="display:none">Next Question</button>
      </div>
    </div>
  </section>

  <section id="screen-results" class="screen">
    <div class="card">
      <h2>Round complete</h2>
      <div class="results-score">
        <div class="big" id="results-score">0 / 0</div>
        <div class="pct" id="results-pct">0%</div>
      </div>
      <div class="btn-row">
        <button id="btn-play-again" class="btn">Play Again</button>
        <button id="btn-download-results" class="btn secondary">Download Results</button>
        <button id="btn-results-history" class="btn secondary">History</button>
        <button id="btn-results-home" class="btn secondary">Home</button>
      </div>
    </div>
  </section>

  <section id="screen-history" class="screen">
    <div class="card">
      <h2>Score history</h2>
      <div id="history-list" class="history-list">
        <div class="empty-note">No rounds played yet.</div>
      </div>
      <div class="btn-row">
        <button id="btn-history-home" class="btn secondary">Home</button>
      </div>
    </div>
  </section>
</div>

window.EMBEDDED_QUESTIONS = [{"id": "2026-08-02-01", "category": "Sport", "question": "For decades this Caribbean island punched absurdly above its weight in amateur boxing, producing Olympic legends like Teófilo Stevenson and Félix Savón, both of whom turned down fortunes to turn professional. Which country?", "options": [{"text": "Cuba", "info": "Its state-run amateur programme made it the most successful Olympic boxing nation outside the United States, with Stevenson and Savón each winning three golds."}, {"text": "The Dominican Republic", "info": "A Caribbean sporting powerhouse too, but its reputation rests on baseball rather than boxing."}, {"text": "Puerto Rico", "info": "Has produced world-class professional boxers such as Félix Trinidad, but not this amateur dynasty."}, {"text": "Trinidad and Tobago", "info": "Better known for sprinting and cricket than for Olympic boxing dominance."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-02", "category": "Sport", "question": "Long before Europeans arrived, communities in the Great Lakes and St. Lawrence region played a stick-and-ball game they called 'the Creator's game', sometimes with hundreds of players and goals kilometres apart. Which people gave the world the ancestor of modern lacrosse?", "options": [{"text": "The Haudenosaunee (Iroquois)", "info": "Their version, baggataway or tewaarathon, was both a sport and a spiritual practice; a Haudenosaunee national team still competes internationally today."}, {"text": "The Inuit", "info": "Arctic peoples developed their own athletic traditions, but not this stick-and-ball game."}, {"text": "The Navajo", "info": "A Southwestern nation with strong running traditions, far from the game's Great Lakes homeland."}, {"text": "The Maya", "info": "Played a famous rubber-ball court game in Mesoamerica, but a completely different sport with no sticks."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-03", "category": "Sport", "question": "Picture volleyball played with the feet, knees, chest and head over a waist-high net, with a ball woven from rattan and spectacular overhead bicycle-kick spikes. Sepak takraw is a national obsession in which Southeast Asian country, whose name provides the 'sepak' half of the sport's official title?", "options": [{"text": "Malaysia", "info": "The modern name combines the Malay 'sepak' (kick) with the Thai 'takraw' (woven ball); Malaysia and Thailand jointly codified the sport in the 1960s."}, {"text": "Vietnam", "info": "Plays its own foot-shuttlecock game, đá cầu, which is related in spirit but a different sport."}, {"text": "The Philippines", "info": "Has a version called sipa, but the international sport's name and rules came from elsewhere."}, {"text": "Myanmar", "info": "Plays the circle game chinlone, non-competitive and without a net."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-04", "category": "Sport", "question": "He won three Formula 1 world titles, was famous for almost supernatural qualifying laps in the wet, and his death at Imola in 1994 triggered the sport's biggest ever safety overhaul. Who was he?", "options": [{"text": "Ayrton Senna", "info": "The Brazilian's fatal crash at the 1994 San Marino Grand Prix, a day after Roland Ratzenberger's, led directly to modern F1 safety standards."}, {"text": "Nelson Piquet", "info": "Another three-time Brazilian world champion, but he retired safely in 1991."}, {"text": "Alain Prost", "info": "The Frenchman was this driver's greatest rival, winning four titles of his own."}, {"text": "Gilles Villeneuve", "info": "A Canadian driver also killed in a qualifying crash, in 1982, but he never won a world title."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-05", "category": "Sport", "question": "Between 1999 and 2017 one player collected 23 Grand Slam singles titles, the most by anyone in the Open Era, and won the Australian Open while in the early weeks of a pregnancy. Who?", "options": [{"text": "Serena Williams", "info": "Her 2017 Australian Open title, won while pregnant, was her 23rd and final major singles trophy."}, {"text": "Steffi Graf", "info": "Holds 22 majors and the only 'Golden Slam', but her career ended in 1999."}, {"text": "Venus Williams", "info": "Won seven singles majors and many doubles titles alongside her sister."}, {"text": "Martina Navratilova", "info": "Won 18 singles majors and a record haul in doubles, mostly in the 1970s and 80s."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-06", "category": "Movies & TV", "question": "In the late 1960s a director spent years researching a biopic so obsessively that his team assembled tens of thousands of index cards on his subject's daily life — then the studio pulled the plug after a rival Napoleon film flopped, and the project became cinema's most famous unmade movie. Which director?", "options": [{"text": "Stanley Kubrick", "info": "His 'Napoleon' was researched down to costume swatches and troop movements but never shot; the material later fed into 'Barry Lyndon'."}, {"text": "David Lean", "info": "Made sweeping historical epics like 'Lawrence of Arabia', and had unrealised projects of his own, but not this one."}, {"text": "Orson Welles", "info": "Left behind several famously unfinished films, including 'The Other Side of the Wind', but no Napoleon project of this scale."}, {"text": "Sergio Leone", "info": "Spent years developing an unmade epic about the siege of Leningrad, a different abandoned passion project."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-07", "category": "Movies & TV", "question": "In the late 1990s Warner Bros. developed a Superman film with Tim Burton directing and a script by Kevin Smith. Costume tests were shot, tens of millions were spent, and then it collapsed — leaving behind photos of one very surprising actor in a long-haired Superman suit. Who was cast as the Man of Steel?", "options": [{"text": "Nicolas Cage", "info": "'Superman Lives' died in pre-production in 1998; the surviving costume-test images of him became internet legend, and he later voiced Superman in an animated film."}, {"text": "Brendan Fraser", "info": "Was considered for superhero roles in that era and later played Robotman, but never wore this suit."}, {"text": "Christopher Reeve", "info": "Played Superman in the original films of 1978-87, long before this abandoned project."}, {"text": "Brandon Routh", "info": "Eventually played the role in 2006's 'Superman Returns', a completely separate production."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-08", "category": "Movies & TV", "question": "In 2012 a quietly devastating drama about a Tehran couple's separation, an ailing father with dementia and a disputed miscarriage won Iran its first Academy Award for Best Foreign Language Film. Who directed it?", "options": [{"text": "Asghar Farhadi", "info": "'A Separation' won the Oscar in 2012, and he won a second for 'The Salesman' in 2017."}, {"text": "Abbas Kiarostami", "info": "The elder statesman of Iranian cinema, winner of the Palme d'Or for 'Taste of Cherry', but he never won this award."}, {"text": "Jafar Panahi", "info": "An acclaimed Iranian director known for films made under a state filmmaking ban, such as 'Taxi'."}, {"text": "Majid Majidi", "info": "Directed 'Children of Heaven', the first Iranian film ever nominated in this category, but it didn't win."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-09", "category": "Movies & TV", "question": "It began in 1987 as crude filler shorts on a variety show, went to its own series two years later, and is now the longest-running scripted primetime series in American television history. Who created this yellow-skinned family?", "options": [{"text": "Matt Groening", "info": "He sketched the family in a lobby minutes before pitching, naming most of them after his own relatives; the shorts ran on 'The Tracey Ullman Show'."}, {"text": "Seth MacFarlane", "info": "Created 'Family Guy' a decade later, an animated sitcom clearly influenced by this one."}, {"text": "Mike Judge", "info": "Created 'Beavis and Butt-Head' and 'King of the Hill' for the same broadcaster, but not this show."}, {"text": "Trey Parker", "info": "Co-created 'South Park' in 1997, a much later animated satire."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-10", "category": "Movies & TV", "question": "Working with a tiny crew, non-professional actors and no completed script, a Bengali graphic designer shot his first feature at weekends over three years, funding it partly by pawning his wife's jewellery. The result, about a village boy named Apu, stunned Cannes in 1956. Who was he?", "options": [{"text": "Satyajit Ray", "info": "'Pather Panchali' launched the Apu Trilogy and Indian arthouse cinema's international reputation; he later received an honorary Academy Award."}, {"text": "Ritwik Ghatak", "info": "A contemporary Bengali director known for films about Partition, but not this trilogy."}, {"text": "Mrinal Sen", "info": "Another leading figure of parallel Indian cinema, active in the same decades."}, {"text": "Guru Dutt", "info": "Made lyrical Hindi classics like 'Pyaasa' in Bombay, a very different filmmaking world."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-11", "category": "Art & Culture", "question": "Listen to the clip below. This slow, deliberately plain piano piece was written in 1888 by a Parisian eccentric who worked as a cabaret pianist, owned a wardrobe of identical grey velvet suits, and later invented the idea of 'furniture music' meant to be ignored. Who wrote it?", "audio": {"type": "file", "url": "https://upload.wikimedia.org/wikipedia/commons/9/90/Erik_Satie_-_gymnopedies_-_la_1_ere._lent_et_douloureux.ogg", "credit": "Performed by Robin Alciatore — public domain recording via Wikimedia Commons"}, "options": [{"t  "An English synth-pop duo active in the same era, but not the makers of this record."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-15", "category": "Art & Culture", "question": "Watch this cover version from 2002, recorded by an ailing country legend near the end of his life and widely considered to eclipse the original. Which band wrote and first released the song, on a bleak 1994 concept album?", "audio": {"type": "youtube", "videoId": "8AHCfZTRGiI", "credit": "Cover: Johnny Cash – 'Hurt', via JohnnyCashVEVO on YouTube — original song by Nine Inch Nails"}, "options": [{"text": "Nine Inch Nails", "info": "Trent Reznor wrote 'Hurt' for 'The Downward Spiral' and said that after hearing this cover, the song no longer felt like his."}, {"text": "Soundgarden", "info": "A Seattle band of the same era with a similarly bleak streak, but not the writers of this song."}, {"text": "Depeche Mode", "info": "The country legend also covered one of their songs, 'Personal Jesus', but that's a different track."}, {"text": "Alice in Chains", "info": "Known for harrowing songs about addiction in the same years, though not this one."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-16", "category": "Art & Culture", "question": "This French electronic duo spent two decades refusing to show their faces, appearing only as a pair of robots in gold and silver helmets, and explained the personas with a story about a studio accident on 9 September 1999. Who were they?", "options": [{"text": "Daft Punk", "info": "Thomas Bangalter and Guy-Manuel de Homem-Christo kept the helmets on from 2001 until the duo announced its split in 2021."}, {"text": "Justice", "info": "A later French electronic duo who used a glowing cross as their emblem rather than costumes."}, {"text": "Air", "info": "A French duo from the same 'French touch' scene, but they performed without disguises."}, {"text": "The Chemical Brothers", "info": "British big-beat pioneers known for elaborate live visuals, not for hiding their identities."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-17", "category": "Art & Culture", "question": "From 1973 each member of this American rock band performed in black-and-white face paint as a fixed character: the Demon, the Starchild, the Spaceman and the Catman. Which band?", "options": [{"text": "Kiss", "info": "Gene Simmons was the Demon, Paul Stanley the Starchild, Ace Frehley the Spaceman and Peter Criss the Catman; they performed unmasked from 1983 to 1996."}, {"text": "Alice Cooper", "info": "Pioneered theatrical shock rock with heavy stage makeup, but as a single frontman persona rather than four characters."}, {"text": "Slipknot", "info": "A much later band whose members wear individual masks and are identified by numbers instead."}, {"text": "The Residents", "info": "An avant-garde group famous for anonymity behind giant eyeball masks, not face paint characters."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-18", "category": "Art & Culture", "question": "This Italian composer left an opera unfinished at his death in 1924; at its premiere the conductor Toscanini stopped the orchestra mid-scene, turned to the audience and said the master had laid down his pen there. Which composer, whose other works include 'La Bohème' and 'Tosca'?", "options": [{"text": "Giacomo Puccini", "info": "He died before completing 'Turandot'; the aria 'Nessun dorma' comes from it, and the opera was finished by Franco Alfano."}, {"text": "Ruggero Leoncavallo", "info": "Wrote 'Pagliacci' in the same verismo tradition, but he died in 1919 and left no such famous fragment."}, {"text": "Pietro Mascagni", "info": "Best known for the one-act 'Cavalleria rusticana', often staged as a double bill with 'Pagliacci'."}, {"text": "Gioachino Rossini", "info": "An earlier Italian opera composer who wrote 'The Barber of Seville' and then largely stopped composing operas at 37."}], "correctIndex": 0, oup cans and celebrity headshots into silkscreen prints, and managed a band while making films in which almost nothing happens for hours. Who was he?", "options": [{"text": "Andy Warhol", "info": "The leading figure of American Pop Art, he also produced The Velvet Underground and survived being shot in 1968."}, {"text": "Roy Lichtenstein", "info": "The other great American Pop artist, working from comic-book panels and Ben-Day dots."}, {"text": "Jasper Johns", "info": "Painted flags and targets in the run-up to Pop Art, but worked in a very different, painterly way."}, {"text": "Robert Rauschenberg", "info": "Made 'combines' merging painting and found objects, a bridge between Abstract Expressionism and Pop."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-22", "category": "Science", "question": "Searching ancient Chinese medical texts in the 1970s for a malaria treatment, one researcher found a 4th-century note about steeping sweet wormwood in cold water — and realised heat was destroying the active compound. Her extraction of artemisinin has since saved millions of lives. Who was she?", "options": [{"text": "Tu Youyou", "info": "She won the 2015 Nobel Prize in Physiology or Medicine, the first Chinese woman to win a Nobel in the sciences, and tested the drug on herself first."}, {"text": "Chien-Shiung Wu", "info": "A Chinese-American physicist whose experiment disproved the conservation of parity, in a completely different field."}, {"text": "Youyou Ma", "info": "Not a scientist at all — a confusion with the cellist Yo-Yo Ma."}, {"text": "Françoise Barré-Sinoussi", "info": "A French virologist who shared a Nobel for the discovery of HIV, not this antimalarial."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-23", "category": "Science", "question": "A 9th-century scholar at Baghdad's House of Wisdom wrote a book on 'al-jabr', solving equations by balancing both sides — and a Latin mangling of his own name later became the word for a step-by-step computational procedure. Who was he?", "options": [{"text": "Al-Khwarizmi", "info": "'Algebra' comes from the title of his treatise and 'algorithm' from the Latinisation of his name, Algoritmi."}, {"text": "Avicenna (Ibn Sina)", "info": "A Persian polymath whose 'Canon of Medicine' dominated European medical teaching for centuries."}, {"text": "Al-Biruni", "info": "A brilliant scholar who measured the Earth's radius with remarkable accuracy, but not the source of these two words."}, {"text": "Omar Khayyam", "info": "Solved cubic equations geometrically and wrote celebrated poetry, but lived two centuries later."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-24", "category": "Science", "question": "In the 1970s an American astronomer measured how fast stars orbit at the edges of spiral galaxies and found they were moving far too quickly to be held in by visible matter alone — strong evidence for something invisible. Who was she?", "options": [{"text": "Vera Rubin", "info": "Her galaxy rotation curves provided the first widely accepted evidence for dark matter; many argued she should have received a Nobel Prize."}, {"text": "Jocelyn Bell Burnell", "info": "Discovered the first radio pulsars in 1967, a different landmark that also famously bypassed her for a Nobel."}, {"text": "Henrietta Swan Leavitt", "info": "Her early-1900s work on variable stars gave astronomers a way to measure cosmic distances."}, {"text": "Annie Jump Cannon", "info": "Classified hundreds of thousands of stellar spectra and devised the system still used today."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-25", "category": "Science", "question": "Between 1856 and 1863 an Augustinian friar in Brno crossbred some 28,000 pea plants, tracking traits like seed colour and pod shape, and worked out the mathematical rules of inheritance — which the scientific world then ignored for 35 years. Who was he?", "options": [{"text": "Gregor Mendel", "info": "His 1866 paper on inherited traits was rediscovered around 1900 and became the foundation of modern genetics."}, {"text": "Hugo de Vries", "info": "One of the botanists who independently rediscovered these laws around 1900 and gave the original credit."}, {"text": "Thomas Hunt Morgan", "info": "Established that genes sit on chromosomes, using fruit flies, decades later."}, {"text": "Carl Linnaeus", "info": "Devised the system for naming and classifying species, a century earlier and unrelated to heredity."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-26", "category": "Science", "question": "Placed under house arrest in 11th-century Cairo after failing to dam the Nile, one scholar used the time to write a 'Book of Optics', showing by experiment that we see because light enters the eye — not because rays shoot out of it. Who was he?", "options": [{"text": "Ibn al-Haytham", "info": "Often called a founder of the experimental method, he also described the camera obscura in detail; the Latin West knew him as Alhazen."}, {"text": "Al-Razi (Rhazes)", "info": "A Persian physician and alchemist who wrote a landmark treatise distinguishing smallpox from measles."}, {"text": "Ibn Rushd (Averroes)", "info": "An Andalusian philosopher famous for commentaries on Aristotle, not for optics experiments."}, {"text": "Roger Bacon", "info": "An English friar who built on this scholar's optical work in the following century."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-27", "category": "History & Geography", "question": "Roughly 9,300 kilometres long and taking about a week end to end, this railway line links Moscow with a Pacific port and crosses eight time zones. What is it called?", "options": [{"text": "The Trans-Siberian Railway", "info": "Completed in stages between 1891 and 1916, it runs from Moscow to Vladivostok and remains the longest railway line in the world."}, {"text": "The Orient Express", "info": "A famous y", "info": "Holds the record for the highest reliably measured air temperature, but is far wetter than this desert."}, {"text": "The Taklamakan", "info": "A vast sand desert in western China ringed by oases of the old caravan routes."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-30", "category": "History & Geography", "question": "Its shore sits about 430 metres below sea level, making it the lowest exposed land on Earth, and its water is so salty that swimmers float on the surface and almost nothing lives in it. Which body of water?", "options": [{"text": "The Dead Sea", "info": "Bordered by Jordan, Israel and the West Bank, it is shrinking by roughly a metre a year as the Jordan River is diverted."}, {"text": "The Caspian Sea", "info": "The world's largest inland body of water, also below sea level but only mildly saline in most parts."}, {"text": "The Great Salt Lake", "info": "A hypersaline Utah lake that is also shrinking, but sits well above sea level."}, {"text": "Lake Assal", "info": "A saline crater lake in Djibouti — Africa's lowest point, and genuinely saltier, but higher than this one."}], "correctIndex": 0, "dateAdded": "2026-08-02"}, {"id": "2026-08-02-31", "category": "History & Geography", "question": "In August 1947 the departing British drew a hastily agreed boundary line across the subcontinent, triggering one of the largest mass migrations in history. Which new state was created alongside independent India, initially in two wings separated by 1,600 kilometres of Indian territory?", "options": [{"text": "Pakistan", "info": "Its eastern wing broke away in 1971 to become Bangladesh; the boundary was drawn by Cyril Radcliffe, who had never visited India before."}, {"text": "Bangladesh", "info": "Did not exist in 1947 — it emerged in 1971 out of the eastern half of the correct answer."}, {"text": "Sri Lanka", "info": "Then called Ceylon, it gained independence separately in 1948 and was not part of this partition."}, {"text": const HISTORY_KEY = "poolbar-quiz-history";

function getHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (err) {
    console.error("Failed to read quiz history", err);
    return [];
  }
}

function addRoundToHistory(round) {
  const history = getHistory();
  history.unshift(round);
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch (err) {
    console.error("Failed to save quiz history", err);
  }
  return history;
}

window.QuizStorage = { getHistory, addRoundToHistory };

function shuffle(array) {
  const arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

async function loadManifest() {
  const res = await fetch("questions/manifest.json");
  if (!res.ok) throw new Error("Could not load questions/manifest.json");
  return res.json();
}

async function loadQuestionSet(fileName) {
  const res = await fetch(`questions/${fileName}`);
  if (!res.ok) throw new Error(`Could not load questions/${fileName}`);
  return res.json();
}

class QuizRound {
  constructor(questions) {
    this.questions = shuffle(questions).map((q) => this.prepareQuestion(q));
    this.currentIndex = 0;
    this.score = 0;
    this.answers = []; // { questionId, correct }
  }

  prepareQuestion(q) {
    const order = shuffle(q.options.map((_, i) => i));
    const options = order.map((originalIndex) => q.options[originalIndex]);
    const correctIndex = order.indexOf(q.correctIndex);
    return {
      id: q.id,
      category: q.category,
      question: q.question,
      audio: q.audio,
      options,
      correctIndex,
    };
  }

  get total() {
    return this.questions.length;
  }

  get current() {
    return this.questions[this.currentIndex];
  }

  get isLast() {
    return this.currentIndex === this.total - 1;
  }

  submitAnswer(selectedIndex) {
    const correct = selectedIndex === this.current.correctIndex;
    if (correct) this.score++;
    this.answers.push({
      questionId: this.current.id,
      category: this.current.category,
      correct,
    });
    return correct;
  }

  advance() {
    this.currentIndex++;
  }

  byCategory() {
    const stats = {};
    this.answers.forEach((a) => {
      if (!stats[a.category]) stats[a.category] = { correct: 0, total: 0 };
      stats[a.category].total++;
      if (a.correct) stats[a.category].correct++;
    });
    return stats;
  }
}

window.Quiz = { shuffle, loadManifest, loadQuestionSet, QuizRound };

const LETTERS = ["A", "B", "C", "D"];
const isEmbedded = Array.isArray(window.EMBEDDED_QUESTIONS);

const screens = {
  start: document.getElementById("screen-start"),
  quiz: document.getElementById("screen-quiz"),
  results: document.getElementById("screen-results"),
  history: document.getElementById("screen-history"),
};

let manifest = null;
let round = null;
let answered = false;
let playerName = "You";
let currentSetId = null;
let lastResult = null;

function showScreen(name) {
  Object.values(screens).forEach((el) => el.classList.remove("active"));
  screens[name].classList.add("active");
}

function slugify(text) {
  return (text || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "") || "player";
}

async function init() {
  if (isEmbedded) {
    renderEmbeddedSetLabel();
  } else {
    try {
      manifest = await Quiz.loadManifest();
      renderSetList();
    } catch (err) {
      document.getElementById("set-list").innerHTML =
        `<div class="empty-note">Failed to load question sets: ${err.message}</div>`;
    }
  }

  document.getElementById("btn-start").addEventListener("click", startQuiz);
  document.getElementById("btn-view-history").addEventListener("click", () => {
    renderHistory();
    showScreen("history");
  });
  document.getElementById("btn-next").addEventListener("click", nextQuestion);
  document.getElementById("btn-play-again").addEventListener("click", startQuiz);
  document.getElementById("btn-download-results").addEventListener("click", downloadResults);
  document.getElementById("btn-results-history").addEventListener("click", () => {
    renderHistory();
    showScreen("history");
  });
  document.getElementById("btn-results-home").addEventListener("click", () => showScreen("start"));
  document.getElementById("btn-history-home").addEventListener("click", () => showScreen("start"));
}

function renderEmbeddedSetLabel() {
  const meta = window.EMBEDDED_SET_META || {};
  const container = document.getElementById("set-list");
  container.innerHTML = `
    <div class="embedded-set-label">${meta.label || "Quiz set"} — ${window.EMBEDDED_QUESTIONS.length} questions</div>
  `;
}

function renderSetList() {
  const container = document.getElementById("set-list");
  container.innerHTML = "";
  manifest.sets.forEach((set, i) => {
    const label = document.createElement("label");
    label.className = "set-option";
    label.innerHTML = `
      <input type="checkbox" value="${set.file}" ${i === 0 ? "checked" : ""} />
      <span>${set.label} — ${set.questionCount} questions</span>
    `;
    container.appendChild(label);
  });
}

function getSelectedSetFiles() {
  return Array.from(document.querySelectorAll("#set-list input:checked")).map((el) => el.value);
}

async function startQuiz() {
  const nameInput = document.getElementById("player-name");
  playerName = (nameInput.value || "").trim() || "You";

  if (isEmbedded) {
    const meta = window.EMBEDDED_SET_META || {};
    currentSetId = meta.id || "embedded";
    round = new Quiz.QuizRound(window.EMBEDDED_QUESTIONS);
    answered = false;
    showScreen("quiz");
    renderQuestion();
    return;
  }

  const files = getSelectedSetFiles();
  if (files.length === 0) {
    alert("Pick at least one question set.");
    return;
  }
  const btn = document.getElementById("btn-start");
  btn.disabled = true;
  try {
    const sets = await Promise.all(files.map((f) => Quiz.loadQuestionSet(f)));
    const allQuestions = sets.flat();
    currentSetId = files.map((f) => f.replace(/\.json$/, "")).join("+");
    round = new Quiz.QuizRound(allQuestions);
    answered = false;
    showScreen("quiz");
    renderQuestion();
  } catch (err) {
    alert(`Failed to start quiz: ${err.message}`);
  } finally {
    btn.disabled = false;
  }
}

function renderDots() {
  const dots = document.getElementById("quiz-dots");
  dots.innerHTML = "";
  round.questions.forEach((q, i) => {
    const dot = document.createElement("span");
    dot.className = "dot";
    if (i < round.answers.length) {
      dot.classList.add(round.answers[i].correct ? "done-correct" : "done-wrong");
    } else if (i === round.currentIndex) {
      dot.classList.add("current");
    }
    dots.appendChild(dot);
  });
}

function renderAudio(audio) {
  const container = document.getElementById("quiz-audio");
  const hasSource = audio && (audio.url || audio.videoId);
  if (!hasSource) {
    container.innerHTML = "";
    container.style.display = "none";
    return;
  }
  container.style.display = "block";

  if (audio.type === "youtube" && audio.videoId) {
    const start = audio.start ? `&start=${audio.start}` : "";
    // Blurred + hidden behind a "listen only" button until answered: the
    // YouTube embed's own thumbnail/title overlay would otherwise name the
    // artist/song outright before anyone even presses play.
    container.innerHTML = `
      <div class="yt-wrap hidden" id="yt-wrap">
        <iframe
          id="yt-frame"
          src="https://www.youtube-nocookie.com/embed/${audio.videoId}?enablejsapi=1&controls=1&modestbranding=1&rel=0${start}"
          title="Audio clip"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
          loading="lazy"
        ></iframe>
        <button type="button" class="yt-reveal-btn" id="yt-play-btn">▶ Play clip — video hidden until you answer</button>
      </div>
      ${audio.credit ? `<span class="audio-credit hidden" id="audio-credit">${audio.credit}</span>` : ""}
    `;
    document.getElementById("yt-play-btn").addEventListener("click", (e) => {
      const frame = document.getElementById("yt-frame");
      frame.contentWindow.postMessage(JSON.stringify({ event: "command", func: "playVideo", args: [] }), "*");
      e.target.textContent = "🔊 Playing — video hidden until you answer";
    });
    return;
  }

  container.innerHTML = `
    <audio controls preload="none" src="${audio.url}"></audio>
    ${audio.credit ? `<span class="audio-credit hidden" id="audio-credit">${audio.credit}</span>` : ""}
  `;
}

function renderQuestion() {
  answered = false;
  const q = round.current;

  document.getElementById("quiz-progress").textContent = `Q ${round.currentIndex + 1}/${round.total}`;
  document.getElementById("quiz-score").textContent = `Score ${round.score}`;
  document.getElementById("quiz-category").textContent = q.category;
  document.getElementById("quiz-question").textContent = q.question;
  renderAudio(q.audio);
  renderDots();

  const optionsEl = document.getElementById("quiz-options");
  optionsEl.innerHTML = "";
  q.options.forEach((opt, i) => {
    const div = document.createElement("div");
    div.className = "option";
    div.dataset.index = i;
    div.innerHTML = `
      <span class="letter">${LETTERS[i]}</span>
      <span class="opt-body">
        <span class="opt-text">${opt.text}</span>
        <span class="opt-info">${opt.info}</span>
      </span>
    `;
    div.addEventListener("click", () => selectAnswer(i));
    optionsEl.appendChild(div);
  });

  document.getElementById("btn-next").style.display = "none";
}

function selectAnswer(selectedIndex) {
  if (answered) return;
  answered = true;

  const q = round.current;
  const correct = round.submitAnswer(selectedIndex);

  const ytWrap = document.getElementById("yt-wrap");
  if (ytWrap) {
    ytWrap.classList.remove("hidden");
    const btn = document.getElementById("yt-play-btn");
    if (btn) btn.remove();
  }
  const audioCredit = document.getElementById("audio-credit");
  if (audioCredit) audioCredit.classList.remove("hidden");

  const optionEls = document.querySelectorAll("#quiz-options .option");
  optionEls.forEach((el) => {
    const i = Number(el.dataset.index);
    el.classList.add("disabled", "revealed");
    if (i === q.correctIndex) {
      el.classList.add("correct");
    } else if (i === selectedIndex) {
      el.classList.add("wrong");
    }
  });

  document.getElementById("quiz-score").textContent = `Score ${round.score}`;
  renderDots();

  const nextBtn = document.getElementById("btn-next");
  nextBtn.textContent = round.isLast ? "See Results" : "Next Question";
  nextBtn.style.display = "inline-block";
}

function nextQuestion() {
  if (round.isLast) {
    finishRound();
    return;
  }
  round.advance();
  renderQuestion();
}

function finishRound() {
  const entry = {
    date: new Date().toISOString(),
    name: playerName,
    setId: currentSetId,
    score: round.score,
    total: round.total,
    byCategory: round.byCategory(),
    answers: round.answers,
  };
  lastResult = entry;
  QuizStorage.addRoundToHistory(entry);

  document.getElementById("results-score").textContent = `${round.score} / ${round.total}`;
  const pct = round.total ? Math.round((round.score / round.total) * 100) : 0;
  document.getElementById("results-pct").textContent = `${pct}%`;
  showScreen("results");
}

function downloadResults() {
  if (!lastResult) return;
  const dateSlug = lastResult.date.slice(0, 10);
  const fileName = `results-${slugify(lastResult.name)}-${dateSlug}.json`;
  const blob = new Blob([JSON.stringify(lastResult, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderHistory() {
  const list = document.getElementById("history-list");
  const history = QuizStorage.getHistory();
  if (history.length === 0) {
    list.innerHTML = `<div class="empty-note">No rounds played yet.</div>`;
    return;
  }
  list.innerHTML = "";
  history.forEach((entry) => {
    const row = document.createElement("div");
    row.className = "history-row";
    const date = new Date(entry.date);
    const dateStr = isNaN(date) ? entry.date : date.toLocaleString();
    const namePart = entry.name ? `${entry.name} — ` : "";
    row.innerHTML = `
      <span>${namePart}${dateStr}</span>
      <span class="score">${entry.score} / ${entry.total}</span>
    `;
    list.appendChild(row);
  });
}

init();

</script>

</body>
</html>
