<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Poolbar Quiznacht Trainer</title>
<style>
:root {
  --felt-dark: #06341f;
  --felt: #0c4a2e;
  --felt-light: #145c3a;
  --brass: #c9a227;
  --brass-bright: #e8c34a;
  --cream: #f3ecd9;
  --cream-dim: #cfc6ab;
  --red: #b3432b;
  --red-bright: #e0553a;
  --green-ok: #4c9a5b;
  --shadow: rgba(0, 0, 0, 0.35);
  --font-mono: "SFMono-Regular", "Consolas", "Liberation Mono", Menlo, monospace;
  --font-body: "Georgia", "Iowan Old Style", serif;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% -10%, var(--felt-light) 0%, var(--felt) 45%, var(--felt-dark) 100%);
  color: var(--cream);
  font-family: var(--font-body);
  display: flex;
  justify-content: center;
  padding: 24px 16px 48px;
}

#app {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

/* Header / branding */
.brand {
  text-align: center;
  margin-bottom: 28px;
}

.brand h1 {
  font-family: var(--font-mono);
  letter-spacing: 0.06em;
  color: var(--brass-bright);
  font-size: 1.5rem;
  margin: 0 0 4px;
  text-transform: uppercase;
  text-shadow: 0 2px 6px var(--shadow);
}

.brand .sub {
  color: var(--cream-dim);
  font-size: 0.85rem;
  font-family: var(--font-mono);
}

/* Card */
.card {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(0, 0, 0, 0.12));
  border: 1px solid rgba(201, 162, 39, 0.35);
  border-radius: 14px;
  padding: 24px 20px;
  box-shadow: 0 10px 30px var(--shadow);
}

/* Buttons */
button {
  font-family: var(--font-body);
  cursor: pointer;
}

.btn {
  display: inline-block;
  background: linear-gradient(180deg, var(--brass-bright), var(--brass));
  color: #23180a;
  border: none;
  border-radius: 8px;
  padding: 12px 22px;
  font-weight: bold;
  font-size: 1rem;
  letter-spacing: 0.02em;
  box-shadow: 0 3px 0 #8a6c15, 0 6px 14px var(--shadow);
  transition: transform 0.08s ease;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn:active {
  transform: translateY(1px);
  box-shadow: 0 1px 0 #8a6c15, 0 3px 8px var(--shadow);
}

.btn.secondary {
  background: transparent;
  color: var(--cream);
  border: 1px solid rgba(243, 236, 217, 0.4);
  box-shadow: none;
}

.btn.secondary:hover {
  border-color: var(--brass-bright);
  color: var(--brass-bright);
}

.btn-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 20px;
}

/* Start screen */
.set-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 18px 0;
}

.set-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid rgba(201, 162, 39, 0.25);
  border-radius: 8px;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--cream-dim);
}

.set-option input {
  accent-color: var(--brass);
}

.name-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 4px 0 18px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--cream-dim);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.name-field input {
  font-family: var(--font-body);
  font-size: 1rem;
  text-transform: none;
  letter-spacing: normal;
  background: rgba(0, 0, 0, 0.2);
  border: 1px solid rgba(201, 162, 39, 0.35);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--cream);
}

.name-field input:focus {
  outline: none;
  border-color: var(--brass-bright);
}

.embedded-set-label {
  font-family: var(--font-mono);
  font-size: 0.9rem;
  color: var(--cream-dim);
  padding: 10px 12px;
  border: 1px solid rgba(201, 162, 39, 0.25);
  border-radius: 8px;
}

/* Scoreboard */
.scoreboard {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  color: var(--brass-bright);
  font-size: 0.9rem;
  margin-bottom: 12px;
  letter-spacing: 0.03em;
}

.dots {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: rgba(243, 236, 217, 0.18);
  border: 1px solid rgba(201, 162, 39, 0.3);
}

.dot.done-correct {
  background: var(--green-ok);
  border-color: var(--green-ok);
}

.dot.done-wrong {
  background: var(--red);
  border-color: var(--red);
}

.dot.current {
  background: var(--brass-bright);
  border-color: var(--brass-bright);
}

/* Question */
.category-tag {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--brass);
  margin-bottom: 8px;
}

.question-text {
  font-size: 1.12rem;
  line-height: 1.5;
  margin: 0 0 20px;
  color: var(--cream);
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  text-align: left;
  background: rgba(0, 0, 0, 0.18);
  border: 1px solid rgba(243, 236, 217, 0.18);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--cream);
  font-size: 0.98rem;
  line-height: 1.4;
}

.option:hover:not(.disabled) {
  border-color: var(--brass-bright);
  background: rgba(201, 162, 39, 0.1);
}

.option .letter {
  font-family: var(--font-mono);
  color: var(--brass);
  font-weight: bold;
  flex-shrink: 0;
}

.option .opt-body {
  flex: 1;
}

.option .opt-info {
  display: none;
  margin-top: 6px;
  font-size: 0.85rem;
  color: var(--cream-dim);
  font-family: var(--font-mono);
  line-height: 1.4;
}

.option.revealed .opt-info {
  display: block;
}

.option.correct {
  border-color: var(--green-ok);
  background: rgba(76, 154, 91, 0.18);
}

.option.correct .letter {
  color: var(--green-ok);
}

.option.wrong {
  border-color: var(--red-bright);
  background: rgba(179, 67, 43, 0.18);
}

.option.wrong .letter {
  color: var(--red-bright);
}

.option.disabled {
  cursor: default;
}

/* Results */
.results-score {
  text-align: center;
  font-family: var(--font-mono);
  margin: 10px 0 24px;
}

.results-score .big {
  font-size: 2.6rem;
  color: var(--brass-bright);
}

.results-score .pct {
  color: var(--cream-dim);
  font-size: 0.9rem;
}

/* History */
.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-row {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  border-bottom: 1px dashed rgba(243, 236, 217, 0.15);
  padding: 8px 2px;
  color: var(--cream-dim);
}

.history-row .score {
  color: var(--brass-bright);
}

.empty-note {
  color: var(--cream-dim);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  text-align: center;
  padding: 20px 0;
}

h2 {
  font-family: var(--font-mono);
  color: var(--brass-bright);
  letter-spacing: 0.03em;
  font-size: 1.1rem;
  margin-top: 0;
}

@media (max-width: 420px) {
  .brand h1 {
    font-size: 1.2rem;
  }
  .card {
    padding: 18px 14px;
  }
}

</style>
</head>
<body>
<div id="app">
  <div class="brand">
    <h1>Poolbar Quiznacht Trainer</h1>
    <div class="sub">Vorarlberg pub quiz practice</div>
  </div>

  <section id="screen-start" class="screen active">
    <div class="card">
      <h2>Choose a question set</h2>
      <div id="set-list" class="set-list">
        <div class="empty-note">Loading question sets…</div>
      </div>
      <label class="name-field">
        <span>Your name (optional)</span>
        <input type="text" id="player-name" placeholder="You" maxlength="40" />
      </label>
      <div class="btn-row">
        <button id="btn-start" class="btn">Start Quiz</button>
        <button id="btn-view-history" class="btn secondary">History</button>
      </div>
    </div>
  </section>

  <section id="screen-quiz" class="screen">
    <div class="card">
      <div class="scoreboard">
        <span id="quiz-progress">Q 1/50</span>
        <span id="quiz-score">Score 0</span>
      </div>
      <div id="quiz-dots" class="dots"></div>
      <div id="quiz-category" class="category-tag"></div>
      <p id="quiz-question" class="question-text"></p>
      <div id="quiz-options" class="options"></div>
      <div class="btn-row">
        <button id="btn-next" class="btn" style="display:none">Next Question</button>
      </div>
    </div>
  </section>

  <section id="screen-results" class="screen">
    <div class="card">
      <h2>Round complete</h2>
      <div class="results-score">
        <div class="big" id="results-score">0 / 0</div>
        <div class="pct" id="results-pct">0%</div>
      </div>
      <div class="btn-row">
        <button id="btn-play-again" class="btn">Play Again</button>
        <button id="btn-download-results" class="btn secondary">Download Results</button>
        <button id="btn-results-history" class="btn secondary">History</button>
        <button id="btn-results-home" class="btn secondary">Home</button>
      </div>
    </div>
  </section>

  <section id="screen-history" class="screen">
    <div class="card">
      <h2>Score history</h2>
      <div id="history-list" class="history-list">
        <div class="empty-note">No rounds played yet.</div>
      </div>
      <div class="btn-row">
        <button id="btn-history-home" class="btn secondary">Home</button>
      </div>
    </div>
  </section>
</div>

pers in 1905 and won the 1921 Nobel Prize in Physics."}, {"text": "Max Planck", "info": "Founded quantum theory, and was actually one of Einstein's early champions in Germany."}, {"text": "Niels Bohr", "info": "Danish physicist known for his model of the atom, a slightly later generation."}, {"text": "Erwin Schrödinger", "info": "Austrian physicist famous for a thought experiment involving a cat."}], "correctIndex": 0, "dateAdded": "2026-07-28"}, {"id": "2026-07-28-21", "category": "Science", "question": "Locked in a bitter rivalry with Thomas Edison over which electrical system should power the world, this Serbian-American inventor championed alternating current, which eventually won out for long-distance power transmission. Who was he?", "options": [{"text": "Nikola Tesla", "info": "Developed AC power systems and held patents used by George Westinghouse."}, {"text": "Thomas Edison", "info": "Championed direct current (DC) in the rivalry known as the 'War of the Currents.'"}, {"text": "George Westinghouse", "info": "Backed Tesla's AC system commercially, but wasn't the inventor himself."}, {"text": "Guglielmo Marconi", "info": "Italian inventor known for pioneering radio, not this electrical rivalry."}], "correctIndex": 0, "dateAdded": "2026-07-28"}, {"id": "2026-07-28-22", "category": "Science", "question": "In 1953, two scientists in Cambridge published a short paper describing DNA's now-famous twisted-ladder shape, building heavily on X-ray images captured by a colleague whose contribution went largely unrecognized during her lifetime. Who were the two scientists officially credited with describing the double helix?", "options": [{"text": "James Watson and Francis Crick", "info": "Published the double helix structure in 1953, drawing on Rosalind Franklin's X-ray data."}, {"text": "Gregor Mendel", "info": "Austrian monk whose 19th-century pea plant experiments founded genetics, decades earlier."}, {"text": "Frederick Sanger", "info": "Developed DNA sequencing methods later, in the 1970s."}, {"text": "Barbara McClintock", "info": "American geneticist known for discovering 'jumping genes' in corn."}], "correctIndex": 0, "dateAdded": "2026-07-28"}, {"id": "2026-07-28-23", "category": "Science", "question": "When a fighter jet exceeds this speed, it produces a sonic boom, and pilots describe the threshold as 'Mach 1.' Roughly how fast does sound travel through air at sea level?", "options": [{"text": "About 343 meters per second", "info": "Roughly 1,235 km/h, though the exact speed varies with air temperature."}, {"text": "About 1,000 meters per second", "info": "Nearly three times too fast to be the actual speed of sound in air."}, {"text": "About 100 meters per second", "info": "Far too slow — that's closer to a fast car's speed, not sound's."}, {"text": "About 3,000 meters per second", "info": "Almost ten times too fast to be sound's actual speed in air."}], "correctIndex": 0, "dateAdded": "2026-07-28"}, {"id": "2026-07-28-24", "category": "Science", "question": "Often called the 'father of modern chemistry,' this 18th-century Frenchman named the elements oxygen and hydrogen, helped disprove an old theory about a fire-releasing substance called 'phlogiston,' and was later executed during the French Revolution. Who was he?", "options": [{"text": "Antoine Lavoisier", "info": "Guillotined in 1794 during the Revolution's Reign of Terror, despite his major scientific contributions."}, {"text": "Joseph Priestley", "info": "English scientist who independently discovered oxygen around the same time."}, {"text": "John Dalton", "info": "English chemist known for early atomic theory, a generation later."}, {"text": "Dmitri Mendeleev", "info": "Russian chemist who created the periodic table, nearly a century later."}], "correctIndex": 0, "dateAdded": "2026-07-28"}, {"id": "2026-07-28-25", "category": "Science", "question": "Developed in 1935 by an American seismologist, this logarithmic scale became the standard public way to describe a tic to the Mediterranean."}, {"text": "The Incense Route", "info": "Carried frankincense and myrrh from Arabia toward the Mediterranean."}, {"text": "The Spice Route", "info": "Primarily refers to later maritime trade routes to Europe by sea."}], "correctIndex": 0, "dateAdded": "2026-07-28"}, {"id": "2026-07-28-28", "category": "History & Geography", "question": "Covering an area roughly the size of the entire United States, this is the largest hot desert in the world, stretching across much of North Africa from the Atlantic coast to the Red Sea. What's it called?", "options": [{"text": "The Sahara Desert", "info": "At about 9.2 million square kilometers, it's the world's largest hot desert."}, {"text": "The Arabian Desert", "info": "A large Middle Eastern desert, but far smaller than the Sahara."}, {"text": "The Gobi Desert", "info": "A cold desert spanning China and Mongolia, not a hot desert."}, {"text": "The Kalahari Desert", "info": "A semi-arid region in southern Africa, much smaller than the Sahara."}], "correctIndex": 0, "dateAdded": "2026-07-28"}, {"id": "2026-07-28-29", "category": "History & Geography", "question": "Perched on a mountain ridge high in the Andes and hidden from Spanish conquistadors, this 15th-century Inca citadel remained largely unknown to the outside world until an American historian was guided to it in 1911. What's it called?", "options": [{"text": "Machu Picchu", "info": "Brought to international attention by Hiram Bingham in 1911, though local communities already knew of it."}, {"text": "Ollantaytambo", "info": "Another significant Inca site in the Sacred Valley, but not this famous citadel."}, {"text": "Nazca", "info": "Famous for its ancient geoglyphs (the 'Nazca Lines'), not an Inca citadel."}, {"text": "Tiwanaku", "info": "An ancient pre-Inca city near Lake Titicaca in what's now Bolivia."}], "correctIndex": 0, "dateAdded": "2026-07-28"}, {"id": "2026-07-28-30", "category": "History & Geography", "question": "Built, rebuilt, and const HISTORY_KEY = "poolbar-quiz-history";

function getHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (err) {
    console.error("Failed to read quiz history", err);
    return [];
  }
}

function addRoundToHistory(round) {
  const history = getHistory();
  history.unshift(round);
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch (err) {
    console.error("Failed to save quiz history", err);
  }
  return history;
}

window.QuizStorage = { getHistory, addRoundToHistory };

function shuffle(array) {
  const arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

async function loadManifest() {
  const res = await fetch("questions/manifest.json");
  if (!res.ok) throw new Error("Could not load questions/manifest.json");
  return res.json();
}

async function loadQuestionSet(fileName) {
  const res = await fetch(`questions/${fileName}`);
  if (!res.ok) throw new Error(`Could not load questions/${fileName}`);
  return res.json();
}

class QuizRound {
  constructor(questions) {
    this.questions = shuffle(questions).map((q) => this.prepareQuestion(q));
    this.currentIndex = 0;
    this.score = 0;
    this.answers = []; // { questionId, correct }
  }

  prepareQuestion(q) {
    const order = shuffle(q.options.map((_, i) => i));
    const options = order.map((originalIndex) => q.options[originalIndex]);
    const correctIndex = order.indexOf(q.correctIndex);
    return {
      id: q.id,
      category: q.category,
      question: q.question,
      options,
      correctIndex,
    };
  }

  get total() {
    return this.questions.length;
  }

  get current() {
    return this.questions[this.currentIndex];
  }

  get isLast() {
    return this.currentIndex === this.total - 1;
  }

  submitAnswer(selectedIndex) {
    const correct = selectedIndex === this.current.correctIndex;
    if (correct) this.score++;
    this.answers.push({
      questionId: this.current.id,
      category: this.current.category,
      correct,
    });
    return correct;
  }

  advance() {
    this.currentIndex++;
  }

  byCategory() {
    const stats = {};
    this.answers.forEach((a) => {
      if (!stats[a.category]) stats[a.category] = { correct: 0, total: 0 };
      stats[a.category].total++;
      if (a.correct) stats[a.category].correct++;
    });
    return stats;
  }
}

window.Quiz = { shuffle, loadManifest, loadQuestionSet, QuizRound };

const LETTERS = ["A", "B", "C", "D"];
const isEmbedded = Array.isArray(window.EMBEDDED_QUESTIONS);

const screens = {
  start: document.getElementById("screen-start"),
  quiz: document.getElementById("screen-quiz"),
  results: document.getElementById("screen-results"),
  history: document.getElementById("screen-history"),
};

let manifest = null;
let round = null;
let answered = false;
let playerName = "You";
let currentSetId = null;
let lastResult = null;

function showScreen(name) {
  Object.values(screens).forEach((el) => el.classList.remove("active"));
  screens[name].classList.add("active");
}

function slugify(text) {
  return (text || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "") || "player";
}

async function init() {
  if (isEmbedded) {
    renderEmbeddedSetLabel();
  } else {
    try {
      manifest = await Quiz.loadManifest();
      renderSetList();
    } catch (err) {
      document.getElementById("set-list").innerHTML =
        `<div class="empty-note">Failed to load question sets: ${err.message}</div>`;
    }
  }

  document.getElementById("btn-start").addEventListener("click", startQuiz);
  document.getElementById("btn-view-history").addEventListener("click", () => {
    renderHistory();
    showScreen("history");
  });
  document.getElementById("btn-next").addEventListener("click", nextQuestion);
  document.getElementById("btn-play-again").addEventListener("click", startQuiz);
  document.getElementById("btn-download-results").addEventListener("click", downloadResults);
  document.getElementById("btn-results-history").addEventListener("click", () => {
    renderHistory();
    showScreen("history");
  });
  document.getElementById("btn-results-home").addEventListener("click", () => showScreen("start"));
  document.getElementById("btn-history-home").addEventListener("click", () => showScreen("start"));
}

function renderEmbeddedSetLabel() {
  const meta = window.EMBEDDED_SET_META || {};
  const container = document.getElementById("set-list");
  container.innerHTML = `
    <div class="embedded-set-label">${meta.label || "Quiz set"} — ${window.EMBEDDED_QUESTIONS.length} questions</div>
  `;
}

function renderSetList() {
  const container = document.getElementById("set-list");
  container.innerHTML = "";
  manifest.sets.forEach((set, i) => {
    const label = document.createElement("label");
    label.className = "set-option";
    label.innerHTML = `
      <input type="checkbox" value="${set.file}" ${i === 0 ? "checked" : ""} />
      <span>${set.label} — ${set.questionCount} questions</span>
    `;
    container.appendChild(label);
  });
}

function getSelectedSetFiles() {
  return Array.from(document.querySelectorAll("#set-list input:checked")).map((el) => el.value);
}

async function startQuiz() {
  const nameInput = document.getElementById("player-name");
  playerName = (nameInput.value || "").trim() || "You";

  if (isEmbedded) {
    const meta = window.EMBEDDED_SET_META || {};
    currentSetId = meta.id || "embedded";
    round = new Quiz.QuizRound(window.EMBEDDED_QUESTIONS);
    answered = false;
    showScreen("quiz");
    renderQuestion();
    return;
  }

  const files = getSelectedSetFiles();
  if (files.length === 0) {
    alert("Pick at least one question set.");
    return;
  }
  const btn = document.getElementById("btn-start");
  btn.disabled = true;
  try {
    const sets = await Promise.all(files.map((f) => Quiz.loadQuestionSet(f)));
    const allQuestions = sets.flat();
    currentSetId = files.map((f) => f.replace(/\.json$/, "")).join("+");
    round = new Quiz.QuizRound(allQuestions);
    answered = false;
    showScreen("quiz");
    renderQuestion();
  } catch (err) {
    alert(`Failed to start quiz: ${err.message}`);
  } finally {
    btn.disabled = false;
  }
}

function renderDots() {
  const dots = document.getElementById("quiz-dots");
  dots.innerHTML = "";
  round.questions.forEach((q, i) => {
    const dot = document.createElement("span");
    dot.className = "dot";
    if (i < round.answers.length) {
      dot.classList.add(round.answers[i].correct ? "done-correct" : "done-wrong");
    } else if (i === round.currentIndex) {
      dot.classList.add("current");
    }
    dots.appendChild(dot);
  });
}

function renderQuestion() {
  answered = false;
  const q = round.current;

  document.getElementById("quiz-progress").textContent = `Q ${round.currentIndex + 1}/${round.total}`;
  document.getElementById("quiz-score").textContent = `Score ${round.score}`;
  document.getElementById("quiz-category").textContent = q.category;
  document.getElementById("quiz-question").textContent = q.question;
  renderDots();

  const optionsEl = document.getElementById("quiz-options");
  optionsEl.innerHTML = "";
  q.options.forEach((opt, i) => {
    const div = document.createElement("div");
    div.className = "option";
    div.dataset.index = i;
    div.innerHTML = `
      <span class="letter">${LETTERS[i]}</span>
      <span class="opt-body">
        <span class="opt-text">${opt.text}</span>
        <span class="opt-info">${opt.info}</span>
      </span>
    `;
    div.addEventListener("click", () => selectAnswer(i));
    optionsEl.appendChild(div);
  });

  document.getElementById("btn-next").style.display = "none";
}

function selectAnswer(selectedIndex) {
  if (answered) return;
  answered = true;

  const q = round.current;
  const correct = round.submitAnswer(selectedIndex);

  const optionEls = document.querySelectorAll("#quiz-options .option");
  optionEls.forEach((el) => {
    const i = Number(el.dataset.index);
    el.classList.add("disabled", "revealed");
    if (i === q.correctIndex) {
      el.classList.add("correct");
    } else if (i === selectedIndex) {
      el.classList.add("wrong");
    }
  });

  document.getElementById("quiz-score").textContent = `Score ${round.score}`;
  renderDots();

  const nextBtn = document.getElementById("btn-next");
  nextBtn.textContent = round.isLast ? "See Results" : "Next Question";
  nextBtn.style.display = "inline-block";
}

function nextQuestion() {
  if (round.isLast) {
    finishRound();
    return;
  }
  round.advance();
  renderQuestion();
}

function finishRound() {
  const entry = {
    date: new Date().toISOString(),
    name: playerName,
    setId: currentSetId,
    score: round.score,
    total: round.total,
    byCategory: round.byCategory(),
    answers: round.answers,
  };
  lastResult = entry;
  QuizStorage.addRoundToHistory(entry);

  document.getElementById("results-score").textContent = `${round.score} / ${round.total}`;
  const pct = round.total ? Math.round((round.score / round.total) * 100) : 0;
  document.getElementById("results-pct").textContent = `${pct}%`;
  showScreen("results");
}

function downloadResults() {
  if (!lastResult) return;
  const dateSlug = lastResult.date.slice(0, 10);
  const fileName = `results-${slugify(lastResult.name)}-${dateSlug}.json`;
  const blob = new Blob([JSON.stringify(lastResult, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderHistory() {
  const list = document.getElementById("history-list");
  const history = QuizStorage.getHistory();
  if (history.length === 0) {
    list.innerHTML = `<div class="empty-note">No rounds played yet.</div>`;
    return;
  }
  list.innerHTML = "";
  history.forEach((entry) => {
    const row = document.createElement("div");
    row.className = "history-row";
    const date = new Date(entry.date);
    const dateStr = isNaN(date) ? entry.date : date.toLocaleString();
    const namePart = entry.name ? `${entry.name} — ` : "";
    row.innerHTML = `
      <span>${namePart}${dateStr}</span>
      <span class="score">${entry.score} / ${entry.total}</span>
    `;
    list.appendChild(row);
  });
}

init();

</script>
